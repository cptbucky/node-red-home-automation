<script type="text/javascript">
  RED.nodes.registerType("home-theatre-activity-controller", {
    category: "home theatre",
    paletteLabel: "theatre activity",
    color: "#d9c7f1",
    defaults: {
      name: {value: ""},
      area: {value: ""},
      freshnessMs: {value: 30000, required: true, validate: RED.validators.number()},
      // User data with no sensible default: empty until the user fills it in,
      // and marked invalid until then, as the runtime rejects it.
      activityProfiles: {value: "{}", required: true, validate: function (v) { try { var parsed = JSON.parse(v); return Boolean(parsed) && typeof parsed === "object" && !Array.isArray(parsed) && Object.keys(parsed).length > 0; } catch (e) { return false; } }}
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["semantic target commands", "activity state and events"],
    icon: "font-awesome/fa-sitemap",
    label: function() { return this.name || "theatre activity"; }
  });
</script>

<script type="text/html" data-template-name="home-theatre-activity-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-freshnessMs">Freshness ms</label><input type="number" id="node-input-freshnessMs"></div>
  <div class="form-row"><label for="node-input-activityProfiles">Profiles JSON</label><input type="text" id="node-input-activityProfiles"></div>
</script>

<script type="text/html" data-help-name="home-theatre-activity-controller">
  <p>Owns latest-request-wins whole-theatre activity state and aggregates generation-scoped target evidence.</p>
  <p>Input <code>msg.theatre</code> accepts activity intent, target-state, target-observation, startup, refresh, recovery and tick events. Messages without <code>msg.theatre</code>, such as a target controller's own events on the same wire, are ignored. Output 1 emits semantic <code>msg.theatreCommand</code> messages for target owners. Output 2 emits activity events and a complete state snapshot. Device transports remain separate.</p>
  <p>Startup without persisted intent probes physical state: the display, AVR, source and backlighting controllers answer
    with <code>msg.theatre = {kind: "target_observation", target, observedAt, values}</code>, what their devices show, on the
    wires that carry their target states. One fresh profile match is adopted without commands. With no evidence, or more than one match, the activity is unknown and nothing is commanded until the next request, so a redeploy or restart never switches a running activity off. Manual overrides are held without corrective commands and adopted only when the physical state uniquely matches a profile.</p>
</script>
