<script type="text/javascript">
  RED.nodes.registerType("home-shelly-switch", {
    category: "home automation",
    color: "#e2d96e",
    defaults: {
      // A marker only a node new from the palette has, as core nodes do: import
      // and paste keep the saved name, so onadd leaves a saved node's settings.
      name: {value: "_DEFAULT_"},
      // Node-RED's MQTT broker node, through which it subscribes to its device's
      // topics and publishes on them itself. The editor offers the first broker
      // when the dialog is opened and saved, not when the node is dropped.
      broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
        return (Boolean(v) && v !== "_ADD_") || this.publishesThroughOutput !== false ? true : "choose a broker";
      }},
      // Whether it reaches its device through MQTT in and out nodes, as before
      // 6.2, and so needs no broker until one is chosen. A node saved before
      // this setting loads without it (the editor applies no defaults to the
      // deployed flows), which counts as true; a new node sets false (onadd).
      // No row.
      publishesThroughOutput: {value: false},
      // No default: it names the user's own device.
      topicPrefix: {value: "", required: true, validate: function (v) {
        var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return prefix !== "" && !/[+#]/.test(prefix);
      }},
      channel: {value: 0, required: true, validate: function (v) {
        return /^\d+$/.test(String(v).trim());
      }},
      // auto: as the device is configured.
      mode: {value: "auto"},
      // The room's id for the light its relay is; empty: not a room light,
      // as before this setting.
      target: {value: ""}
    },
    onadd: function () {
      if (this.name !== "_DEFAULT_") return;
      this.name = "";
      this.publishesThroughOutput = false;
    },
    oneditprepare: function () {
      var node = this;
      // While it reaches its device through MQTT in and out nodes, that it does
      // until given a broker.
      function rows() {
        var broker = $("#node-input-broker").val();
        $(".device-through-output").toggle(node.publishesThroughOutput !== false && (!broker || broker === "_ADD_"));
      }
      $("#node-input-broker").on("change", rows);
      rows();
    },
    oneditsave: function () {
      // A broker chosen: it publishes itself from now on.
      var broker = $("#node-input-broker").val();
      if (broker && broker !== "_ADD_") this.publishesThroughOutput = false;
      else if (this.publishesThroughOutput !== false) this.publishesThroughOutput = true;
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ["to the device (MQTT out, without a broker)", "to the switch policy (detached), or the relay's state", "to the room lighting controller (with a Target)"],
    icon: "font-awesome/fa-toggle-on",
    label: function () { return this.name || "shelly switch"; },
    paletteLabel: "shelly switch"
  });
</script>

<script type="text/html" data-template-name="home-shelly-switch">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips">With a broker, it subscribes to its device's topics and publishes on them itself: the MQTT in and
    MQTT out nodes around it are no longer needed and can be deleted.</div>
  <div class="form-tips device-through-output">This node reaches its device through MQTT in and out nodes, as before 6.2,
    and keeps working that way. Choose a Broker to let it do so itself.</div>
  <div class="form-row"><label for="node-input-topicPrefix">MQTT topic prefix</label><input type="text" id="node-input-topicPrefix" placeholder="the device's ID, e.g. shellyplus1-a8032ab12345"></div>
  <div class="form-row"><label for="node-input-channel">Switch ID</label><input type="number" min="0" step="1" id="node-input-channel"></div>
  <div class="form-row">
    <label for="node-input-mode">Mode</label>
    <select id="node-input-mode">
      <option value="auto">As the device is set up</option>
      <option value="detached">Detached: the switch's presses</option>
      <option value="relay">Relay: the relay is the light</option>
    </select>
  </div>
  <div class="form-row"><label for="node-input-target">Target</label><input type="text" id="node-input-target" placeholder="the room's id for the light the relay is (optional)"></div>
</script>

<script type="text/html" data-help-name="home-shelly-switch">
  <p>Connects one switch channel of a Shelly Gen2 or later relay, over the device's own MQTT API, used the way the
    device is set up: no function nodes, no Home Assistant and no HTTP.</p>
  <p>The devices: <a href="https://shelly-api-docs.shelly.cloud/gen2/" target="_blank">Shelly's Gen2+ device documentation</a>.</p>
  <h3>Wiring</h3>
  <p>With a <b>Broker</b>, it subscribes to <code>&lt;prefix&gt;/#</code> and publishes on its device's topics itself: leave out the MQTT
    in and MQTT out nodes below (still wired, they change nothing). Its first output then sends nothing. A node saved
    before 6.2 keeps using them until you choose a broker.</p>
  <ol>
    <li>An <b>MQTT in</b> node subscribed to <code>&lt;prefix&gt;/#</code> (output: auto-detect) → this node.</li>
    <li>This node's first output → an <b>MQTT out</b> node on the same broker, with no topic set.</li>
    <li>Detached: this node's second output → a <b>home switch lighting policy</b>, whose intents go to the room
      controller.</li>
    <li>When the relay is a room light (a <b>Target</b> set): the room controller's second output (its light
      commands) → this node, and this node's third output → the room controller.</li>
  </ol>
  <p>On the device, MQTT must be on with <b>Enable MQTT Control</b> and <b>RPC status notifications</b> (both the
    default).</p>
  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>MQTT topic prefix</dt><dd>the device's topic prefix: its device ID (such as
      <code>shellyplus1-a8032ab12345</code>) unless a custom one is set on the device.</dd>
    <dt>Switch ID</dt><dd><code>0</code>, or the number of another switch on a device with more than one. Use one
      node per switch.</dd>
    <dt>Mode</dt><dd><i>As the device is set up</i> (the default) reads the device's own configuration; the other two
      override it, and are needed when it can't be read.</dd>
    <dt>Target</dt><dd>optional: the room's id for the light the relay is, in the room controller's Targets JSON,
      marked <code>"onOffOnly": true</code>. Set, the node is that light's adapter, in either mode. Empty, the relay
      isn't a room light, as before.</dd>
  </dl>
  <h3>As a room light</h3>
  <p>With a <b>Target</b>, the relay is that light, whether the device is detached (the wall switch's presses still
    go to the switch policy, and the room switches the relay) or not (the relay follows the switch, and the room
    switches it too). It speaks the room's neutral light contract, like the zigbee2mqtt light:</p>
  <ul>
    <li>The room's <code>msg.light</code> commands for its Target switch the relay: <code>on</code> or
      <code>off</code> on <code>&lt;prefix&gt;/command/switch:&lt;n&gt;</code>. A relay has no brightness or colour,
      so those are left out; mark the target on/off only. Commands for other lights are ignored, so one wire from the
      room can feed every light's node. An <code>observe</code> asks the relay for its status.</li>
    <li>Its readings go to the room on output 3: <code>observed</code> with the relay's output; <code>external</code>
      when the relay changes with no command of this node's pending (a person at a switch the relay follows, the
      Shelly app), or when someone else's <code>on</code>, <code>off</code> or <code>toggle</code> appears on its
      command topic (its own commands' echoes are recognised as its own); and <code>availability</code>, shown,
      never acted on.</li>
    <li>The status shows the light's state, such as <i>detached, switch input · hall on</i>.</li>
  </ul>
  <h3>What it does</h3>
  <ul>
    <li>At startup, and whenever the device comes online, it asks the device for its configuration
      (<code>Shelly.GetConfig</code>, with the reply addressed under the device's prefix, so the same MQTT in node
      receives it) and for its whole status. The node status shows what it found, such as <i>detached, switch
      input</i>. If nothing answers within 10 seconds, the status says <i>configuration unreadable: set Mode</i>, and
      nothing is passed on until <b>Mode</b> says how.</li>
    <li><b>Detached</b>, without a Target: the relay stays on, powering smart bulbs, and is never switched from here. A switch-type input's
      on/off becomes <code>msg.source = "switch"</code> with <code>msg.payload = {state}</code> (the first, from the
      device's status, marked <code>baseline</code>); a button-type input's pushes become
      <code>msg.source = "switch-action"</code> with <code>single</code>, <code>double</code> or <code>long</code>
      (the switch policy acts on single and double; long is passed on for later use). The device going offline or online becomes
      <code>msg.source = "switch-availability"</code>. If the relay reports off, the status warns: the bulbs have lost
      power. With a Target, the relay is the light and the room switches it (see above).</li>
    <li><b>Relay</b> (follow, flip, momentary and the other modes): the relay is the light. Its state becomes
      <code>msg.switchState = {kind: "observed", on, person, observedAt}</code>, with <code>person</code> true when
      the change came from the device's own input; <code>msg.switchCommand = {power: "on" | "off"}</code> switches it.
      No node of this package reads that state yet.</li>
    <li>Readings are timed when they arrive.</li>
  </ul>
  <h3>When MQTT out connects</h3>
  <p>Wire a <b>Status node</b> whose scope is your MQTT out node into this node. Each time MQTT out shows
    "connected", this node takes it as its startup message (<code>msg.shellySwitch = {kind: "startup"}</code>) and reads the device's configuration again:
    Node-RED's MQTT broker node drops what it is given before it connects, so what the node sends as the flows
    start is lost on a first start, a full deploy or a restart. Any other status message is ignored.</p>
</script>
