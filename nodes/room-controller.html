<script type="text/javascript">
  (function () {
    // A setting is on unless it was explicitly switched off; null ("not set")
    // shows as ticked.
    function on(value) { return value !== false && value !== "false"; }
    // Its Home Assistant choice, from the open dialog or its saved settings: a
    // room saved before the choice reads its two old settings, where not set
    // means on (lib/home-assistant-setting.ts).
    function choiceOf(node) {
      var select = $("#node-input-homeAssistant");
      if (select.length) return select.val();
      if (node.homeAssistant === "off" || node.homeAssistant === "state" || node.homeAssistant === "discovery") return node.homeAssistant;
      return !on(node.publishState) ? "off" : on(node.discovery) ? "discovery" : "state";
    }
    // Whether it publishes through its output, as before 6.2: a room saved
    // before the Publish choice that published, or one opened and saved since
    // without a broker (publishesThroughOutput). It needs no broker until
    // one is chosen; from saved values only, not the open dialog.
    function throughOutput(node) {
      if (node.publishesThroughOutput === true) return true;
      var saved = node.homeAssistant === null || node.homeAssistant === undefined;
      return saved && on(node.publishState);
    }
    // Each old setting, and the circadian lighting policy field it goes into.
    var MOVED = {
      houseSchedule: "Schedule", wakeTime: "Wake time", bedTime: "Bed time",
      maxBrightnessPct: "Daytime brightness %", maxColorTempKelvin: "Daytime kelvin",
      sleepBrightnessPct: "Sleep brightness %", sleepColorTempKelvin: "Sleep kelvin",
      refreshTransitionSeconds: "Restyle transition (s)", refreshSeconds: "Restyle interval (s)", initialSleep: "Start in sleep mode"
    };
    function given(value) { return value !== undefined && value !== null && value !== ""; }
    function moved(value) { return !given(value); }
    function parsedTargets(json) {
      try { var targets = JSON.parse(json || "[]"); return Array.isArray(targets) ? targets : []; } catch (e) { return []; }
    }
    // A room saved before 6.0 named each light's Zigbee2MQTT topics. Each
    // target with topics, and the zigbee2mqtt light that replaces them; null
    // when they aren't <base>/<name> and <base>/<name>/set, to set up by hand.
    function lightPlan(targets) {
      return targets.filter(function (target) {
        return target && (target.stateTopic !== undefined || target.commandTopic !== undefined);
      }).map(function (target) {
        var state = typeof target.stateTopic === "string" ? target.stateTopic : "";
        var slash = state.indexOf("/");
        var z2m = target.commandTopic === state + "/set" && slash > 0 && slash < state.length - 1
          ? {baseTopic: state.slice(0, slash), friendlyName: state.slice(slash + 1)}
          : null;
        return {id: String(target.id), stateTopic: target.stateTopic, commandTopic: target.commandTopic, z2m: z2m};
      });
    }
    // The targets as 6.0 has them: ids, and onOffOnly, for every light whose
    // topics were Zigbee2MQTT's. A light whose topics weren't keeps them: the
    // room stays refused, naming it, until its adapter is set up by hand and
    // its topics removed, so it can't be lost silently.
    function neutralTargets(targets) {
      var flagged = lightPlan(targets).filter(function (entry) { return !entry.z2m; }).map(function (entry) { return entry.id; });
      return targets.map(function (target) {
        if (target && flagged.indexOf(String(target.id)) >= 0) return target;
        return target && target.onOffOnly === true ? {id: target.id, onOffOnly: true} : {id: target && target.id};
      });
    }
    // Adds a zigbee2mqtt light for each light the plan can, wired to the room
    // (its light commands in, readings back) and to the MQTT out nodes the
    // room publishes through, with an MQTT in node on each light's topics
    // when their broker is known. One undo step.
    function createLights(roomId, plan) {
      var room = RED.nodes.node(roomId);
      if (!room) return 0;
      var outs = [];
      RED.nodes.eachLink(function (link) {
        if (link.source === room && link.sourcePort === 0 && link.target.type === "mqtt out") outs.push(link.target);
      });
      var broker = outs.length ? outs[0].broker : "";
      var add = [];
      plan.filter(function (entry) { return entry.z2m; }).forEach(function (entry, index) {
        var lightId = RED.nodes.id();
        var y = room.y + 80 * (index + 1);
        add.push({id: lightId, type: "home-z2m-light", z: room.z, x: room.x + 260, y: y, name: "", target: entry.id,
          baseTopic: entry.z2m.baseTopic, friendlyName: entry.z2m.friendlyName, group: false, wires: [[], []]});
        if (broker) {
          add.push({id: RED.nodes.id(), type: "mqtt in", z: room.z, x: room.x + 40, y: y, name: "", broker: broker,
            topic: entry.z2m.baseTopic + "/" + entry.z2m.friendlyName + "/#", qos: "1", datatype: "auto-detect", nl: false,
            rap: true, rh: 0, inputs: 0, wires: [[lightId]]});
        }
      });
      if (!add.length) return 0;
      var wasDirty = RED.nodes.dirty();
      var imported = RED.nodes.import(add, {generateIds: false});
      var links = imported.links.slice();
      imported.nodes.filter(function (n) { return n.type === "home-z2m-light"; }).forEach(function (light) {
        [{source: room, sourcePort: 1, target: light}, {source: light, sourcePort: 1, target: room}].concat(outs.map(function (out) {
          return {source: light, sourcePort: 0, target: out};
        })).forEach(function (link) { RED.nodes.addLink(link); links.push(link); });
      });
      RED.history.push({t: "add", nodes: imported.nodes.map(function (n) { return n.id; }), links: links, dirty: wasDirty});
      RED.nodes.dirty(true);
      RED.view.redraw(true);
      return imported.nodes.filter(function (n) { return n.type === "home-z2m-light"; }).length;
    }
    RED.nodes.registerType("home-room-lighting-controller", {
      category: "home lighting",
      paletteLabel: "room lighting",
      color: "#ffd27f",
      defaults: {
        // A marker only a node new from the palette has, as core nodes do: import
        // and paste keep the saved name, so onadd leaves a saved node's settings.
        name: {value: "_DEFAULT_"},
        // Required only when the room publishes something named after it, and
        // then with a letter or digit, from which its topics and IDs are made.
        area: {value: "", validate: function (v) {
          // A room saved before the choice needed one whenever either old
          // setting was on, as the runtime still checks.
          var legacy = !$("#node-input-homeAssistant").length && (this.homeAssistant === null || this.homeAssistant === undefined) &&
            (on(this.publishState) || on(this.discovery));
          return (choiceOf(this) === "off" && !legacy) || /[a-z0-9]/i.test(String(v || ""));
        }},
        // off, state or discovery. null means "not set": a room saved before
        // this setting, read from the two below. New nodes start off (onadd).
        homeAssistant: {value: null},
        // Node-RED's MQTT broker node, through which it publishes itself.
        // Needed unless Publish is "Don't publish". The editor offers the first
        // broker when the dialog is opened and saved, not when the node is
        // dropped.
        broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
          return choiceOf(this) === "off" || (Boolean(v) && v !== "_ADD_") || throughOutput(this) ? true : "choose a broker, or set Publish to Don't publish";
        }},
        // The two settings the choice replaced, kept with no form rows so the
        // editor carries a saved room's: null means "not set", which kept
        // publishing (on) before the choice.
        publishState: {value: null},
        discovery: {value: null},
        // true for a room that publishes through its output, as before 6.2,
        // and was opened and saved without a broker: it stays valid until a
        // broker is chosen. No form row.
        publishesThroughOutput: {value: false},
        // How Home Assistant IDs are named. null means "not set": a node saved
        // before this setting, which keeps its area-named entities. New nodes
        // name them after the node (onadd), so renaming the area keeps them.
        idScheme: {value: null},
        displayName: {value: ""},
        discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
        targets: {value: "[]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
        initialTransitionSeconds: {value: 1, required: true, validate: RED.validators.number()},
        // The circadian settings of a room saved before 6.0, which moved to
        // the circadian lighting policy. Kept here, with no form rows, so the
        // editor carries them: without them, a deploy from the editor would
        // make an unmigrated room valid and quietly unstyled. Each shows the
        // room as invalid until the dialog is saved, which clears them.
        maxBrightnessPct: {value: "", validate: moved},
        maxColorTempKelvin: {value: "", validate: moved},
        sleepBrightnessPct: {value: "", validate: moved},
        sleepColorTempKelvin: {value: "", validate: moved},
        refreshTransitionSeconds: {value: "", validate: moved},
        refreshSeconds: {value: "", validate: moved},
        initialSleep: {value: "", validate: moved},
        wakeTime: {value: "", validate: moved},
        bedTime: {value: "", validate: moved},
        // The house schedule it followed, kept the same way (not as a
        // config-node reference, as the room no longer uses one).
        houseSchedule: {value: "", validate: moved}
      },
      onadd: function () {
        if (this.name !== "_DEFAULT_") return;
        this.name = "";
        this.idScheme = "node";
        this.homeAssistant = "off";
        this.publishState = false;
        this.discovery = false;
      },
      oneditprepare: function () {
        var node = this;
        $("#node-input-homeAssistant").val(choiceOf(node));
        // The broker only for publishing, the prefix only for discovery; for a
        // room that publishes through its output, that it does until given a
        // broker.
        var outputBefore = throughOutput(node);
        function follow() {
          var choice = $("#node-input-homeAssistant").val();
          var broker = $("#node-input-broker").val();
          $(".room-broker").toggle(choice !== "off");
          $(".room-through-output").toggle(choice !== "off" && outputBefore && (!broker || broker === "_ADD_"));
          $(".room-discovery").toggle(choice === "discovery");
          $("#node-input-area, #node-input-broker").trigger("change");
        }
        $("#node-input-homeAssistant, #node-input-broker").on("change", follow);
        follow();
        // A room saved before 6.0: its circadian settings, to copy into a
        // circadian lighting policy.
        var old = Object.keys(MOVED).filter(function (key) { return given(node[key]); });
        $("#room-moved-circadian").toggle(old.length > 0);
        $("#room-moved-circadian-values").text(old.map(function (key) {
          var value = node[key];
          if (key === "houseSchedule") {
            var schedule = RED.nodes.node(value);
            value = schedule ? (schedule.name || schedule.id) : value + " (no longer in the flows)";
          }
          return MOVED[key] + " " + value;
        }).join(", "));
        // Its lights' topics, which move to a zigbee2mqtt light each.
        var plan = lightPlan(parsedTargets(node.targets));
        $("#room-moved-lights").toggle(plan.length > 0);
        $("#room-moved-lights-list").empty();
        plan.forEach(function (entry) {
          $("<li>").text(entry.id + ": " + (entry.z2m
            ? "zigbee2mqtt light, base topic " + entry.z2m.baseTopic + ", friendly name " + entry.z2m.friendlyName
            : "topics " + entry.stateTopic + " and " + entry.commandTopic + " aren't Zigbee2MQTT's: set it up by hand on the neutral light contract")).appendTo("#room-moved-lights-list");
        });
        $("#room-create-lights").toggle(plan.some(function (entry) { return entry.z2m; })).off("click").on("click", function (event) {
          event.preventDefault();
          var made = createLights(node.id, plan);
          $(this).prop("disabled", true).text(made + " zigbee2mqtt light node" + (made === 1 ? "" : "s") + " added");
        });
      },
      // Saving the dialog migrates the room: its old circadian settings go.
      oneditsave: function () {
        var node = this;
        // The two settings it replaced, kept in step.
        var choice = $("#node-input-homeAssistant").val();
        // Through its output until a broker is chosen (read before the
        // dialog's values are applied).
        var broker = $("#node-input-broker").val();
        node.publishesThroughOutput = throughOutput(node) && (!broker || broker === "_ADD_");
        node.publishState = choice !== "off";
        node.discovery = choice === "discovery";
        Object.keys(MOVED).forEach(function (key) { node[key] = ""; });
        // Its targets become ids: their topics are the lights' adapters' now.
        var targets = parsedTargets($("#node-input-targets").val());
        if (lightPlan(targets).length) $("#node-input-targets").val(JSON.stringify(neutralTargets(targets)));
      },
      // For the editor's tests.
      lightPlan: lightPlan,
      neutralTargets: neutralTargets,
      createLights: createLights,
      inputs: 1,
      outputs: 3,
      outputLabels: ["MQTT publications (MQTT out)", "light commands (to each light's adapter)", "light readings (to activity lighting)"],
      icon: "font-awesome/fa-lightbulb-o",
      label: function () { return this.name || (this.area ? this.area + " " : "") + "lighting controller"; }
    });
  })();
</script>

<script type="text/html" data-template-name="home-room-lighting-controller">
  <div class="form-tips" id="room-moved-circadian" style="display:none; margin-bottom:12px;">
    <b>Circadian lighting moved to its own node in 6.0.</b> Add a <i>circadian lighting policy</i>, wire its first
    output to this room, and set its fields to this room's settings from before: <span id="room-moved-circadian-values"></span>.
    A room that should stay unstyled needs no policy. Saving this dialog then clears them here, and the room runs again.
  </div>
  <div class="form-tips" id="room-moved-lights" style="display:none; margin-bottom:12px;">
    <b>Lights are reached through light adapters in 6.0.</b> Each light below needs a <i>zigbee2mqtt light</i> node:
    <ul id="room-moved-lights-list"></ul>
    <button type="button" class="red-ui-button" id="room-create-lights">Create Zigbee2MQTT light nodes</button>
    It adds and wires one per light (and an MQTT in node on its topics when the room's MQTT out shows the broker).
    Delete the old MQTT in nodes on the lights' state and command topics. Saving this dialog keeps only each
    Zigbee2MQTT light's id in Targets JSON. A light whose topics aren't Zigbee2MQTT's keeps them, and the room stays
    an invalid configuration naming it: set up its adapter by hand on the neutral light contract, then remove its
    topics from Targets JSON.
  </div>
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area" placeholder="needed when publishing"></div>
  <div class="form-row">
    <label for="node-input-homeAssistant">Publish</label>
    <select id="node-input-homeAssistant">
      <option value="off">Don't publish</option>
      <option value="state">MQTT state</option>
      <option value="discovery">MQTT state and Home Assistant discovery</option>
    </select>
  </div>
  <div class="form-row room-broker"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips room-broker">With a broker, the room publishes itself: an MQTT out on its first output, and a
    Status node, are no longer needed and can be deleted.</div>
  <div class="form-tips room-through-output">This room publishes through its first output, as before 6.2, and keeps
    working that way. Choose a Broker to let it publish itself.</div>
  <div class="form-row"><label for="node-input-displayName">Display name</label><input type="text" id="node-input-displayName"></div>
  <div class="form-row room-discovery"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
  <div class="form-row"><label for="node-input-targets">Targets JSON</label><input type="text" id="node-input-targets"></div>
  <div class="form-row"><label for="node-input-initialTransitionSeconds">Turn-on transition seconds</label><input type="number" id="node-input-initialTransitionSeconds"></div>
</script>

<script type="text/html" data-help-name="home-room-lighting-controller">
  <p>Owns a room's lights: it turns intents from policies (motion, wall switches, activities) into light commands,
    keeps track of who controls each light, and styles the lights it controls with the style it is sent.</p>
  <h3>Style</h3>
  <p>Wire a <i>circadian lighting policy</i> into the room to style its lights over the day. The room keeps the
    latest style it was sent and uses it when a light it controls comes on with no values given (a motion ON, a
    wall-switch press), on each new style for lights that are on, after someone else's bare ON, and when the last
    owner releases a light the room was running. A style never switches a light on or off and never reaches a light that an owner holds or a
    person set. With no style, or once a style has run out, the lights just go on and off. Any node may send a style:
    <code>msg.lighting = {kind: "style", values: {brightnessPct, colorTempKelvin} | null, transitionSeconds, until}</code>.</p>
  <p><b>From 5.x:</b> circadian lighting, sleep, the wake and bed times and the house schedule moved to the circadian
    lighting policy in 6.0. A room saved before 6.0 is an invalid configuration until it is migrated: add a circadian
    lighting policy wired to the room, with the room's old settings (the dialog lists them), then open and save the
    room. Circadian, sleep and schedule messages sent to the room are ignored, with a warning.</p>
  <h3>Lights and their adapters</h3>
  <p>The room reaches each light through an adapter, such as a <i>zigbee2mqtt light</i> node per light: wire the
    room's second output (its light commands, <code>msg.light</code>) into every adapter, and each adapter's readings
    back into the room. The adapter tells the room's own commands from other people's, and the room acts on someone
    else's: a command with values makes the light manual, and someone else's bare ON is restyled at most once every 5
    seconds, so it never answers itself in a loop. At its startup message the room asks each light for a reading. A
    light's availability, as its adapter reports it, is shown on its control state and in the status, and changes
    nothing. For a light that isn't Zigbee2MQTT's, any flow that answers <code>msg.light</code> commands with
    <code>msg.light</code> readings works in the adapter's place (see the README's neutral light contract).</p>
  <h3>Publishing</h3>
  <p><b>Publish</b> adds what it publishes for other systems to see, named after the <b>Area</b>, which is
    needed unless it is <i>Don't publish</i>. Topics and IDs use it in lowercase, with spaces and other characters (anything but
    letters, digits, <code>_</code> and <code>-</code>) as <code>_</code>: <i>Living Room</i> publishes under
    <code>home/living_room/…</code>.</p>
  <dl class="message-properties">
    <dt>Publish</dt><dd><i>Don't publish</i>; <i>MQTT state</i>, plain MQTT for any system to read: each light's control state on
      <code>home/&lt;area&gt;/lighting/&lt;target&gt;/control</code>, and the room's availability on
      <code>home/&lt;area&gt;/lighting/availability</code>; <i>MQTT state and Home Assistant discovery</i>: that, and
      a control sensor for each light announced to Home Assistant, which reads that state. At every start the room also clears the circadian, sleep, wake and bed entities it published before 6.0.
      A room saved before this setting reads its two old ones (Publish state over MQTT, Home Assistant discovery):
      off/off is Don't publish, on/off MQTT state, on/on MQTT state and Home Assistant discovery, and not set at all
      keeps publishing both.</dd>
    <dt>Broker</dt><dd>Node-RED's MQTT broker node. With one, the room publishes itself: each time the broker connects,
      reconnects included, and each time Home Assistant comes back (<code>online</code> on
      <code>&lt;prefix&gt;/status</code>), it clears what it no longer publishes and announces its entities,
      availability and every light's control state, so they come back by themselves. Each connect also runs its
      startup, as a Status node's "connected" did without a broker: each light is asked for a reading. <code>offline</code> as it stops;
      deleted, everything it published is cleared. An MQTT out on output 1 and a Status node are then no longer needed:
      output 1 sends nothing, and a Status node still wired in is ignored. Needed for a new room unless Publish is <i>Don't publish</i>;
      opening and saving the room offers the first broker in your flows. A room saved before 6.2 that publishes keeps
      publishing through output 1 and needs no broker until you choose one. Without one, the room publishes through output 1 as
      before: once the flows start and at its startup message, which a Status node watching your MQTT out sends each
      time it connects, with <code>offline</code> getting through only when this node is deployed on its own, so set
      the MQTT broker node's Birth, Close and Will messages to the same (see the README).</dd>
    <dt>Discovery prefix</dt><dd>the topic prefix Home Assistant listens on for discovery: <code>homeassistant</code>
      unless you changed it in Home Assistant's MQTT settings. Shown with Home Assistant discovery.</dd>
  </dl>
  <p>New nodes start with <i>Don't publish</i>.</p>
  <h3>Targets</h3>
  <p>A JSON list of lights, each <code>{"id"}</code>: the name its adapter's <b>Target</b> and the policies use. Add <code>"onOffOnly": true</code>
    for a light that only switches on and off: it is never sent brightness, colour or a transition, styles skip it,
    and values an intent gives it are left out with a warning once per deploy. Who controls it works as for any light.
    <b>Turn-on transition seconds</b> is the transition for a light switched on, styled or with an intent's values.</p>
  <h3>Control state</h3>
  <p>Each target has one control state:</p>
  <dl class="message-properties">
    <dt>in-control</dt><dd>the room styles the light with the style it is sent. This is the default.</dd>
    <dt>overridden</dt><dd>another owner, such as an activity or a scene, holds the light on or off. Styles and
      owner-less intents leave it alone until it is released.</dd>
    <dt>manual</dt><dd>a person set the light: an intent with <code>manual: true</code> (a wall switch's double
      press), or someone else's command on the light with values, as its adapter reports it. An intent's values alone don't make a light
      manual. Switching circadian lighting on returns manual lights to in-control.</dd>
  </dl>
  <p>An overridden light changes only for an intent with an <code>owner</code> (its own, or a newer owner who takes
    it over), a person (a <code>manual: true</code> intent, <code>person: true</code>, set by the wall-switch policies, someone else's command on the light, or a change
    seen at the light), or a release. Any other intent, including motion ON or OFF and owner-less values, leaves it
    alone and is traced as <code>ignored held-by</code>; other targets in the same intent are still handled.
    A person switching a held light off returns it to in-control; a person switching on a light an owner holds off
    makes it manual. Either way it leaves every owner, and their later releases leave it alone.</p>
  <p>Owners stack, per light. The first owner to take a light records what it was: its control state, whether it was
    on, and the values it last reported. A newer owner goes on top and sets the light; the owner beneath keeps its
    own request, and sending again updates it without changing the light. Releasing the owner on top hands the light
    to the owner beneath, with what that owner last asked for; releasing an owner beneath just drops it. When the
    last owner lets go, the light goes back to what was recorded: a light the room was running is the room's again,
    on or off as it was, in the room's style as it is now; a light that was off goes off; a light a person had set
    gets its values back and stays manual.</p>
  <p>The control states are kept in the node's context. When the node starts with nothing saved (its first deploy,
    or a redeploy or restart without a context store, see the README), it can't know which lights were held or set
    by a person, so it leaves every light as it is: no style restyles a light until an intent or release names it,
    someone switches it on with a bare ON, or circadian lighting is switched on. A light that is
    on at that start and that nothing names keeps its start-time style; to bring it back into step, switch circadian
    lighting on (for example with the Home Assistant circadian switch), or let motion or a wall switch name it.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>lighting.kind = "intent"</dt>
    <dd><code>state</code> ON, OFF or TOGGLE for <code>targets</code> (default: all), with optional
      <code>values</code> (<code>brightnessPct</code> 0-100, <code>colorTempKelvin</code>, <code>effect</code> and other
      fields passed on as they are).</dd>
    <dt>lighting.kind = "style"</dt>
    <dd>how lights should look, usually from a circadian lighting policy (see Style).</dd>
    <dt>lighting.owner <span class="property-type">string</span></dt>
    <dd>on an <code>intent</code>, holds its targets on or off for this owner (overridden), on top of any other
      owner's. With
      <code>preserveManual: true</code>, manual lights are skipped.</dd>
    <dt>lighting.area <span class="property-type">string</span></dt>
    <dd>on an <code>intent</code> or <code>release</code>, the room it is for: this room acts on it only when it
      matches its <b>Area</b> (compared as in topics), so a scene wired to several rooms reaches only its own
      lights. Without it, any room it reaches acts on it.</dd>
    <dt>lighting.kind = "release"</dt>
    <dd>lets go of overridden <code>targets</code> (default: all) for <code>owner</code>, or for every owner without
      one. A light goes to the owner beneath, or with none left back to what it was before the first.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>MQTT publications, for an MQTT out node, when it has no <b>Broker</b> (with one, it publishes itself and this
      output sends nothing): unless <b>Publish</b> is <i>Don't publish</i>, on startup and whenever a target's
      control state or availability changes, a retained message on <code>home/&lt;area&gt;/lighting/&lt;target&gt;/control</code>
      with payload <code>{"state": "in-control" | "overridden" | "manual", "owner": string | null, "available"?: boolean}</code>
      (<code>available</code> once its adapter has reported it), and the room's availability and discovery.</li>
    <li>Light commands, <code>msg.light</code>, for the lights' adapters: <code>{kind: "command", target, state,
      brightnessPct?, colorTempKelvin?, transitionSeconds?, extra?, restyle?, source, id}</code>, and
      <code>{kind: "observe", target}</code> at its startup message.</li>
    <li>Each light's reading, <code>msg.light</code>, passed on with <code>control</code> and <code>manual</code>, for
      activity lighting.</li>
  </ol>
  <h3>When MQTT out connects</h3>
  <p>Wire a <b>Status node</b> whose scope is your MQTT out node into this node. Each time MQTT out shows
    "connected", this node takes it as its startup message (<code>msg.lighting = {kind: "startup"}</code>) and announces itself again:
    Node-RED's MQTT broker node drops what it is given before it connects, so what the node sends as the flows
    start is lost on a first start, a full deploy or a restart. Any other status message is ignored.</p>
</script>
