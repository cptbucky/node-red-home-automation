<script type="text/javascript">
  RED.nodes.registerType("home-display-mode-controller", {
    category: "home theatre",
    paletteLabel: "display",
    color: "#c7d9f1",
    defaults: {
      name: {value: ""},
      area: {value: ""},
      tvHost: {value: "", required: true},
      screenHost: {value: "", required: true},
      // Optional: without one, the flow reports the projector's power. A node
      // still naming only the old key is invalid until this is set.
      projectorPowerMeterHost: {value: "", validate: function (v) {
        return String(v || "").trim() !== "" || String(this.projectorMeterHost || "").trim() === "";
      }},
      // The name before 5.0, removed in 6.0 but kept here, with no form row,
      // so the editor carries it: dropped, a deploy from the editor would
      // quietly switch the node to having no built-in meter. With it, the
      // node stays an invalid configuration until the new host is set.
      projectorMeterHost: {value: ""},
      // Empty: the screen's own open command. No shared default position: a
      // node saved with one keeps it.
      screenOpenPosition: {value: "", validate: function (v) {
        if (v === undefined || v === null || String(v).trim() === "") return true;
        var position = Number(v);
        return isFinite(position) && position > 0 && position <= 100;
      }},
      screenTolerance: {value: 2, required: true, validate: RED.validators.number()},
      pollMs: {value: 2000, required: true, validate: RED.validators.number()},
      queryTimeoutMs: {value: 5000, required: true, validate: RED.validators.number()},
      tvTimeoutMs: {value: 30000, required: true, validate: RED.validators.number()},
      screenTimeoutMs: {value: 65000, required: true, validate: RED.validators.number()},
      projectorWarmupMs: {value: 60000, required: true, validate: RED.validators.number()},
      projectorMinimumWarmupMs: {value: 15000, required: true, validate: RED.validators.number()},
      projectorShutdownConfirmMs: {value: 5000, required: true, validate: RED.validators.number()},
      projectorCooldownMs: {value: 120000, required: true, validate: RED.validators.number()},
      maxAttempts: {value: 2, required: true, validate: RED.validators.number()},
      projectorOnWatts: {value: 20, required: true, validate: RED.validators.number()},
      projectorOffWatts: {value: 10, required: true, validate: RED.validators.number()},
      projectorPowerFallback: {value: false},
      transportTimeoutMs: {value: 5000, required: true, validate: RED.validators.number()}
    },
    credentials: {tvPsk: {type: "password"}},
    // Once the new host is set, the removed name goes.
    oneditsave: function () {
      if (String($("#node-input-projectorPowerMeterHost").val() || "").trim() !== "") this.projectorMeterHost = "";
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ["projector IR fallback", "state and results", "projector power queries"],
    icon: "font-awesome/fa-television",
    label: function () { return this.name || (this.area ? this.area + " " : "") + "display mode"; }
  });
</script>

  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>

  <div class="form-row"><label for="node-input-tvHost">TV host</label><input type="text" id="node-input-tvHost"></div>
  <div class="form-row"><label for="node-input-tvPsk">TV pre-shared key</label><input type="password" id="node-input-tvPsk"></div>
  <div class="form-row"><label for="node-input-screenHost">Screen controller host</label><input type="text" id="node-input-screenHost"></div>

  <div class="form-row"><label for="node-input-pollMs">Confirmation poll milliseconds</label><input type="number" id="node-input-pollMs"></div>
  <div class="form-row"><label for="node-input-queryTimeoutMs">Query timeout milliseconds</label><input type="number" id="node-input-queryTimeoutMs"></div>
  <div class="form-row"><label for="node-input-tvTimeoutMs">TV confirmation timeout</label><input type="number" id="node-input-tvTimeoutMs"></div>
  <div class="form-row"><label for="node-input-screenTimeoutMs">Screen movement timeout</label><input type="number" id="node-input-screenTimeoutMs"></div>
  <div class="form-row"><label for="node-input-projectorWarmupMs">Projector warm-up timeout</label><input type="number" id="node-input-projectorWarmupMs"></div>
  <div class="form-row"><label for="node-input-projectorMinimumWarmupMs">Projector minimum warm-up</label><input type="number" id="node-input-projectorMinimumWarmupMs"></div>
  <div class="form-row"><label for="node-input-projectorShutdownConfirmMs">Projector shutdown confirm delay</label><input type="number" id="node-input-projectorShutdownConfirmMs"></div>
  <div class="form-row"><label for="node-input-projectorCooldownMs">Projector cool-down timeout</label><input type="number" id="node-input-projectorCooldownMs"></div>
  <div class="form-row"><label for="node-input-maxAttempts">Maximum idempotent attempts</label><input type="number" id="node-input-maxAttempts"></div>
  <div class="form-row"><label for="node-input-projectorOnWatts">Projector on watts</label><input type="number" id="node-input-projectorOnWatts"></div>
  <div class="form-row"><label for="node-input-projectorOffWatts">Projector standby watts</label><input type="number" id="node-input-projectorOffWatts"></div>
  <div class="form-row"><label for="node-input-projectorPowerFallback">Projector power is fallback</label><input type="checkbox" id="node-input-projectorPowerFallback"></div>
  <div class="form-row"><label for="node-input-transportTimeoutMs">Transport timeout milliseconds</label><input type="number" id="node-input-transportTimeoutMs"></div>
</script>

<script type="text/html" data-help-name="home-display-mode-controller">
  <p>Owns Bravia power, projector lamp power and projector-screen position for <code>off</code>, <code>tv</code> and <code>projector</code> modes.</p>
  <p>Switching between the TV and the projector is make before break, so a source that is already playing keeps a
    picture: for the projector, the lamp starts and warms up, then the screen opens, and the TV goes to standby last;
    for the TV, it comes on before the projector shuts down and the screen closes. If the projector fails to start, the
    TV is left on. A projector warming up or cooling down finishes before a newer request changes it; if it doesn't finish in time, the
    newer request carries on from what the projector then reports.</p>
  <p>Send <code>msg.display = {kind: "intent", requestId, generation, mode}</code>. Send <code>kind: "startup"</code> after deployment to query every owned device and reconcile persisted intent. Send <code>kind: "refresh"</code> to re-confirm a settled display from fresh readings.</p>
  <p>Each device is reached directly over its LAN API. The <b>TV host</b> is a Sony Bravia with IP control and a
    pre-shared key. The <b>Screen controller host</b> is a Shelly Gen2 cover (its <code>Cover</code> RPC). For
    projector mode it opens the screen to the <b>Screen viewing position</b> (a percentage of its travel) and confirms it
    within the <b>Screen position tolerance</b>; left empty, it uses the screen's own open command and confirms the
    screen fully open, which also suits a screen that isn't calibrated for positions. Other modes close it with its
    own close, which runs to the end and restores a position the screen has lost. A viewing position needs a screen
    that knows where it is: one that doesn't is closed first, and if it still has no position (not calibrated), the
    request fails with reason <code>screen-not-calibrated</code>; calibrate it, or clear the viewing position. The
    <b>Projector power meter host</b>, if set, is a Shelly Gen2 switch with power metering on the projector's supply
    (switch 1), read against <b>Projector on watts</b> and <b>Projector standby watts</b>. A node still naming
    that host <code>projectorMeterHost</code>, as before 5.0, is an invalid configuration, in the editor and when
    deployed: that name was removed in 6.0, so set <b>Projector power meter host</b>.</p>
  <p>Output 1 carries the projector power toggle (<code>msg.payload = "power"</code> with <code>msg.display_command</code>) for your infrared transport, commanded directly rather than through Home Assistant. Enable “Projector power is fallback” to include its use in activity metrics. Output 2 emits observed state plus ready, manual-override, failed, rejected and superseded results, and <code>msg.theatre</code> target state for the theatre activity controller: wire it straight back to that controller. Output 3 asks for the projector's power when there is no meter host (below).</p>
  <h3>Projector power from your own flow</h3>
  <p>Leave <b>Projector power meter host</b> empty to report the projector's power from any meter or adapter: send
    <code>msg.display = {kind: "observed", device: "projector", power: "on"}</code> (<code>"on"</code>,
    <code>"standby"</code> or <code>"transitioning"</code>, in lower case), or a meter's reading as <code>watts: 140</code>,
    read against the on and standby watts. A smart plug's own <code>ON</code> and <code>OFF</code> are its socket, not the
    lamp, so send its power in watts instead. A lamp <code>"transitioning"</code>, or watts between the two, keeps its last
    settled state while it warms or cools. <code>observedAt</code> (an ISO time) and <code>source</code> are optional.</p>
  <p>The node needs a fresh projector reading at every request and while it confirms a change. When it does, it sends
    <code>msg.payload = "query"</code> on output 3: wire that to whatever makes your meter report, such as a Zigbee2MQTT
    plug's <code>/get</code> topic. Output 3 can be left unwired only if the meter reports on its own at least once every
    <b>Query timeout milliseconds</b>, whether or not the power changes; a meter that reports only on a change says
    nothing while the projector sits steady. A device that hasn't reported within the query timeout is asked again, up to
    <b>Maximum idempotent attempts</b> in all, and then the request fails with reason <code>no-reading</code>, naming
    the device. This applies to every device, with or without a meter host: keep <b>Transport timeout milliseconds</b>
    below <b>Query timeout milliseconds</b> &times; <b>Maximum idempotent attempts</b>, so a slow device's answer
    arrives before it is given up on.</p>
  <p>An unsolicited physical-state change after readiness latches manual ownership. The controller observes and reports it without issuing corrective commands; a newer activity intent resumes automation.</p>
  <p>The TV pre-shared key remains in Node-RED's encrypted credential store and is never emitted in a message or status.</p>
</script>
