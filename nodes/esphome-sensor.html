<script type="text/javascript">
  RED.nodes.registerType("home-esphome-sensor", {
    category: "home automation",
    color: "#e2d96e",
    defaults: {
      name: {value: ""},
      // Node-RED's MQTT broker node, through which it subscribes to the
      // device's topics. The editor offers the first broker when the dialog is
      // opened and saved.
      broker: {value: "", type: "mqtt-broker", required: true},
      // No default: it names the user's own device.
      device: {value: "", required: true, validate: function (v) {
        var device = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return device !== "" && !/[+#]/.test(device);
      }},
      // The named models the package knows; their entities are fixed in it.
      model: {value: "", required: true, validate: function (v) {
        return v === "everything-presence-one" || v === "apollo-r-pro-1";
      }}
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["motion and presence, to occupancy fusion", "light level, to the motion lighting policy"],
    icon: "font-awesome/fa-eye",
    label: function () { return this.name || this.device || "esphome sensor"; },
    paletteLabel: "esphome sensor"
  });
</script>

<script type="text/html" data-template-name="home-esphome-sensor">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-row"><label for="node-input-device">Device</label><input type="text" id="node-input-device" placeholder="its ESPHome name (topic prefix)"></div>
  <div class="form-row"><label for="node-input-model">Model</label><select id="node-input-model">
    <option value="">choose…</option>
    <option value="everything-presence-one">Everything Presence One</option>
    <option value="apollo-r-pro-1">Apollo R PRO-1</option>
  </select></div>
  <div class="form-tips">It subscribes to the model's entities and the device's status itself: no MQTT in, change or
    function nodes.</div>
</script>

<script type="text/html" data-help-name="home-esphome-sensor">
  <p>Connects an ESPHome presence sensor to a room: the entities its model uses for motion, presence and light level
    become the messages <b>home occupancy fusion</b> and the <b>home motion lighting policy</b> take, over ESPHome's own
    MQTT messages: no function or change nodes, and never Home Assistant.</p>
  <h3>Wiring</h3>
  <ol>
    <li>Output 1 (motion and presence) → occupancy fusion.</li>
    <li>Output 2 (light level) → the motion lighting policy.</li>
  </ol>
  <p>Choose the <b>Broker</b> the device uses, set <b>Device</b> to its ESPHome name (its MQTT topic prefix), and pick its
    <b>Model</b>.</p>
  <h3>Models</h3>
  <ul>
    <li><b>Everything Presence One</b>: motion from <code>pir</code>, presence from <code>mmwave</code>, light level from
      <code>illuminance</code>.</li>
    <li><b>Apollo R PRO-1</b>: motion from <code>moving_target</code> or <code>ld2412_moving_target</code>, presence from
      <code>presence</code> or <code>ld2412_presence</code> (either radar), light level from <code>ltr390_light</code>.</li>
  </ul>
  <h3>Readings</h3>
  <ul>
    <li>Output 1: <code>{source: "motion" | "presence", payload: true | false}</code>, from ON and OFF only. Where a model
      has two entities for a role, it is on when either is.</li>
    <li>Output 2: <code>{source: "illuminance", payload: &lt;lux&gt;}</code>, from a number only.</li>
    <li>Anything else (such as <code>nan</code>) is ignored with a trace, and only a change is sent.</li>
    <li>As Node-RED starts, ESPHome's retained states are the device's current ones while its status is online. They
      are sent with <code>msg.baseline = true</code>: an occupied room switches nothing on, and an empty one starts its
      vacancy, so its lights go off when the motion policy's delay runs out. A retained state from a device that isn't
      online is ignored.</li>
  </ul>
</script>
