<script type="text/javascript">
  (function () {
  function on(value) { return value === true || value === "true"; }
  // Its Publish choice (off, state or discovery), from the open dialog or
  // its saved settings: a node saved before the choice reads its two old
  // settings (lib/home-assistant-setting.ts).
  function publishChoice(node) {
    function on(value) { return value === true || value === "true"; }
    var select = $("#node-input-homeAssistant");
    if (select.length) return select.val();
    if (node.homeAssistant === "off" || node.homeAssistant === "state" || node.homeAssistant === "discovery") return node.homeAssistant;
    return !on(node.publishState) ? "off" : on(node.discovery) ? "discovery" : "state";
  }
  // Whether it publishes through its output, as before 6.2: a node saved
  // before the Publish choice that published, or one opened and saved since
  // without a broker (publishesThroughOutput). It needs no broker until one
  // is chosen; from saved values only, not the open dialog.
  function throughOutput(node) {
    if (node.publishesThroughOutput === true) return true;
    return (node.homeAssistant === null || node.homeAssistant === undefined) && (node.publishState === true || node.publishState === "true");
  }
  // Its area is needed while it publishes, and for a node saved before the
  // choice whenever either old setting was on, as the runtime checks.
  function needsArea(node) {
    function on(value) { return value === true || value === "true"; }
    var saved = !$("#node-input-homeAssistant").length && (node.homeAssistant === null || node.homeAssistant === undefined);
    return publishChoice(node) !== "off" || (saved && (on(node.publishState) || on(node.discovery)));
  }
  RED.nodes.registerType("home-motion-lighting-policy", {
    category: "home automation",
    color: "#d8bfd8",
    defaults: {
      // A marker only a node new from the palette has, as core nodes do: import
      // and paste keep the saved name, so onadd leaves a saved node's settings.
      name: {value: "_DEFAULT_"},
      // Required only when the node publishes, and then with a letter or
      // digit, from which its topics and IDs are made.
      area: {value: "", validate: function (v) { return !needsArea(this) || /[a-z0-9]/i.test(String(v || "")); }},
      onTargets: {value: "[\"main\"]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      offTargets: {value: "[\"main\"]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      defaultDelaySeconds: {value: 120, required: true, validate: RED.validators.number()},
      defaultIlluminanceCutoff: {value: 10, required: true, validate: RED.validators.number()},
      // How long a pause lasts unless renewed, so a lost release can't stop
      // motion lighting for good.
      maxPauseSeconds: {value: 600, required: true, validate: function (v) { return RED.validators.number()(v) && Number(v) >= 1; }},
      // Motion published nothing before these settings, so both start off.
      // Publish: off, state or discovery. null means "not set": a node saved
      // before this setting, read from the two below, kept with no rows.
      homeAssistant: {value: null},
      // Node-RED's MQTT broker node, through which it publishes and reads its set
      // topics itself. Needed unless Publish is "Don't publish". The editor offers
      // the first broker when the dialog is opened and saved, not when the node
      // is dropped.
      broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
        return publishChoice(this) === "off" || (Boolean(v) && v !== "_ADD_") || throughOutput(this) ? true : "choose a broker, or set Publish to Don't publish";
      }},
      publishState: {value: false},
      discovery: {value: false},
      // true for a node that publishes through its output, as before 6.2, and
      // was opened and saved without a broker: it stays valid until a broker is
      // chosen. No form row.
      publishesThroughOutput: {value: false},
      discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
      // How Home Assistant IDs are named; motion has no older entities, so not
      // set also means "node".
      idScheme: {value: null}
    },
    onadd: function () {
      if (this.name !== "_DEFAULT_") return;
      this.name = "";
      this.idScheme = "node";
    },
    oneditsave: function () {
      // Through its output until a broker is chosen (read before the
      // dialog's values are applied).
      var broker = $("#node-input-broker").val();
      this.publishesThroughOutput = throughOutput(this) && (!broker || broker === "_ADD_");
    },
    oneditprepare: function () {
      $("#node-input-homeAssistant").val(publishChoice(this));
      // The broker only while it publishes, the prefix only with discovery.
      var outputBefore = throughOutput(this);
      function publishRows() {
        var broker = $("#node-input-broker").val();
        $(".publish-through-output").toggle($("#node-input-homeAssistant").val() !== "off" && outputBefore && (!broker || broker === "_ADD_"));
        var choice = $("#node-input-homeAssistant").val();
        $(".publish-broker").toggle(choice !== "off");
        $(".publish-discovery").toggle(choice === "discovery");
        $("#node-input-area, #node-input-broker").trigger("change");
      }
      $("#node-input-homeAssistant, #node-input-broker").on("change", publishRows);
      publishRows();
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["lighting intents", "MQTT publications"],
    icon: "font-awesome/fa-lightbulb-o",
    label: function () { return this.name || (this.area ? this.area + " " : "") + "motion policy"; }
  });
  })();
</script>

<script type="text/html" data-template-name="home-motion-lighting-policy">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-onTargets">ON targets</label><input type="text" id="node-input-onTargets"></div>
  <div class="form-row"><label for="node-input-offTargets">OFF targets</label><input type="text" id="node-input-offTargets"></div>
  <div class="form-row"><label for="node-input-defaultDelaySeconds">Vacancy seconds</label><input type="number" id="node-input-defaultDelaySeconds"></div>
  <div class="form-row"><label for="node-input-defaultIlluminanceCutoff">Lux cutoff</label><input type="number" id="node-input-defaultIlluminanceCutoff"></div>
  <div class="form-row"><label for="node-input-maxPauseSeconds">Maximum pause (s)</label><input type="number" id="node-input-maxPauseSeconds"></div>
  <div class="form-row">
    <label for="node-input-homeAssistant">Publish</label>
    <select id="node-input-homeAssistant">
      <option value="off">Don't publish</option>
      <option value="state">MQTT state</option>
      <option value="discovery">MQTT state and Home Assistant discovery</option>
    </select>
  </div>
  <div class="form-row publish-broker"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips publish-broker">With a broker, it publishes and reads its set topics itself: an MQTT out on its
    publication output, an MQTT in on its set topics, and a Status node are no longer needed and can be deleted.</div>
  <div class="form-tips publish-through-output">This node publishes through its output, as before 6.2, and keeps
    working that way. Choose a Broker to let it publish itself.</div>
  <div class="form-row publish-discovery"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
</script>

<script type="text/html" data-help-name="home-motion-lighting-policy">
  <p>Turns normalised occupancy, illuminance and enable-state events into <code>msg.lighting</code> intents: ON when
    the room is occupied and dark enough, and OFF once it has been vacant for the vacancy time. The OFF intent carries
    <code>vacantSince</code>, so the room lighting controller keeps any light a person set after the room went
    vacant.</p>
  <p>Wall switches go to the <b>switch lighting policy</b> node, not here; switch messages sent to this node are
    ignored.</p>
  <h3>Inputs</h3>
  <p>Each message names its kind in <code>msg.source</code>:</p>
  <dl class="message-properties">
    <dt>occupancy</dt><dd><code>msg.payload.occupied</code>, from the occupancy fusion node.</dd>
    <dt>illuminance</dt><dd>the light level in lux.</dd>
    <dt>area-enabled</dt><dd><code>true</code> or <code>false</code> for this node; <code>global-enabled</code> for every
      motion node (deprecated, removed in 7.0: send <code>area-enabled</code> to each policy instead; it still works
      until then, with a warning once per deploy and a note on the status). Any other value, such as <code>"ON"</code> (accepted before 6.0), is refused: nothing changes, the
      node logs a warning once per deploy and shows it on its status.</dd>
    <dt>delay</dt><dd>a new vacancy time, in <b>seconds</b>, the same unit as <b>Vacancy seconds</b>.</dd>
    <dt>illuminance-cut-off</dt><dd>a new lux cutoff.</dd>
    <dt>pause</dt><dd><code>true</code> pauses motion lighting, <code>false</code> releases it, for the owner in
      <code>msg.owner</code> (for example a cover's name), which is required. A pause lasts at most the
      <b>Maximum pause</b> unless sent again, so a lost release can't stop motion lighting for good. Motion lighting acts only while no owner holds a pause,
      and a pause cancels a pending vacancy timer, as switching it off does. A vacancy while paused or switched
      off isn't forgotten: when motion resumes (every pause released or run out, and both enables on) in a room
      still vacant, the vacancy timer starts then, and the off intent names when the room went vacant. A pause never changes the enables,
      which are the user's own: wire a cover's <i>moving</i> output here to pause motion while it moves. Any value but
      <code>true</code> or <code>false</code> is refused, as for the enables.</dd>
  </dl>
  <p>A <code>delay</code> or <code>illuminance-cut-off</code> message overrides the setting, and lasts across
    restarts until the node is deployed with a different <b>Vacancy seconds</b> or <b>Lux cutoff</b>, which then
    applies. Lasting across a redeploy or restart needs a context store (see the README's recommended setup).</p>
  <p>When the node starts with nothing saved (its first deploy, or a redeploy or restart without a context store),
    it doesn't know whether the room is occupied, so it counts the room as vacant from then: unless occupancy is
    reported within <b>Vacancy seconds</b>, it sends its off intent. Lights left on when Node-RED stopped are not
    left on for good, but someone sitting still in a lit room has the lights switched off after the delay unless
    motion is seen. After a restart the room controller has also forgotten which lights a person set, so it doesn't
    keep those either. With a context store, a running off-timer carries on instead.</p>
  <h3>Publishing</h3>
  <p>Off unless switched on, and then named after the <b>Area</b>, which is needed.</p>
  <dl class="message-properties">
    <dt>Publish: MQTT state</dt><dd>whether this node's motion lighting is enabled, retained <code>ON</code> or
      <code>OFF</code> on <code>home/&lt;area&gt;/motion/enabled/state</code>, and its vacancy delay in seconds on
      <code>home/&lt;area&gt;/motion/delay/state</code>, with <code>online</code> or <code>offline</code> on
      <code>home/&lt;area&gt;/motion/availability</code>. It acts on <code>ON</code>/<code>OFF</code> sent to
      <code>…/enabled/set</code> and a delay of 0 to 86400 seconds sent to <code>…/delay/set</code>, as the
      <code>area-enabled</code> and <code>delay</code> inputs do; wire an MQTT in node on
      <code>home/&lt;area&gt;/motion/+/set</code> into this node. The shared <code>global-enabled</code> (deprecated) is
      not published, and the switch shows this node's enable only, so motion can still be off everywhere while it
      shows on.</dd>
    <dt>Publish: MQTT state and Home Assistant discovery</dt><dd>a motion lighting switch and a vacancy delay number (in the device's
      configuration). It includes the MQTT state, which they read.</dd>
  </dl>
  <p>These go on the second output; wire it to an MQTT out node. The node announces itself once the flows have
    started, and again when it receives <code>msg.source = "startup"</code>.</p>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Lighting intents, for the room lighting controller.</li>
    <li>MQTT publications, when publishing is on.</li>
  </ol>
  <h3>Broker</h3>
  <p>Choose Node-RED's <b>MQTT broker</b> node, and it publishes and reads its set topics itself: it announces everything each time the
    broker connects, reconnects included, and each time Home Assistant comes back (<code>online</code> on
    <code>&lt;prefix&gt;/status</code>), so its entities come back by themselves.
    Each connect also runs its startup message, as a Status node's "connected" did without a broker. Its publication output then sends
    nothing, and an MQTT out on it, an MQTT in on its set topics and a Status node are no longer needed: still wired, they change nothing.
    Opening and saving the node offers the first broker in your flows. A node saved before 6.2 that publishes keeps
    publishing on its output, as below, and needs no broker until you choose one.</p>
  <h3>When MQTT out connects</h3>
  <p>Without a broker, wire a <b>Status node</b> whose scope is your MQTT out node into this node. Each time MQTT out shows
    "connected", this node takes it as its startup message (<code>msg.source = "startup"</code>) and announces itself again:
    Node-RED's MQTT broker node drops what it is given before it connects, so what the node sends as the flows
    start is lost on a first start, a full deploy or a restart. Any other status message is ignored.</p>
</script>
