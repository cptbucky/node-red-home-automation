<script type="text/javascript">
  RED.nodes.registerType("home-switch-lighting-policy", {
    category: "home lighting",
    paletteLabel: "switch policy",
    color: "#d8bfd8",
    defaults: {
      name: {value: ""},
      area: {value: ""},
      targets: {value: "[\"main\"]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      switchWindowMs: {value: 500, required: true, validate: RED.validators.number()},
      switchFreshnessSeconds: {value: 3600, required: true, validate: RED.validators.number()}
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-toggle-on",
    label: function () { return this.name || (this.area ? this.area + " " : "") + "switch policy"; }
  });
</script>

<script type="text/html" data-template-name="home-switch-lighting-policy">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-targets">Targets</label><input type="text" id="node-input-targets"></div>
  <div class="form-row"><label for="node-input-switchWindowMs">Raw-edge window ms</label><input type="number" id="node-input-switchWindowMs"></div>
  <div class="form-row"><label for="node-input-switchFreshnessSeconds">Input freshness seconds</label><input type="number" id="node-input-switchFreshnessSeconds"></div>
</script>

<script type="text/html" data-help-name="home-switch-lighting-policy">
  <p>Turns raw switch edges or pre-classified single/double actions into <code>msg.lighting</code> intents without occupancy or motion state. Raw wall state preserves a persisted baseline, treats retained observations as inert re-baselines and exposes fresh, stale, unavailable or awaiting-baseline status. Send availability as <code>msg.source = "switch-availability"</code>; mark a polled snapshot with <code>msg.baseline = true</code>.</p>
</script>
