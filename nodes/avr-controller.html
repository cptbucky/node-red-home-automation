<script type="text/javascript">
  (function () {
  function on(value) { return value === true || value === "true"; }
  function given(value) { return value !== undefined && value !== null && String(value).trim() !== ""; }
  // A dB bound. A node saved before 5.0 has none (its 0-98 bounds were
  // removed in 6.0), so it shows as invalid until they are set.
  function volumeBound(value) { return given(value) && Number.isFinite(Number(value)); }
  // Its Publish choice (off, state or discovery), from the open dialog or
  // its saved settings: a node saved before the choice reads its two old
  // settings (lib/home-assistant-setting.ts).
  function publishChoice(node) {
    function on(value) { return value === true || value === "true"; }
    var select = $("#node-input-homeAssistant");
    if (select.length) return select.val();
    if (node.homeAssistant === "off" || node.homeAssistant === "state" || node.homeAssistant === "discovery") return node.homeAssistant;
    return !on(node.publishState) ? "off" : on(node.discovery) ? "discovery" : "state";
  }
  // Whether it publishes through its output, as before 6.2: a node saved
  // before the Publish choice that published, or one opened and saved since
  // without a broker (publishesThroughOutput). It needs no broker until one
  // is chosen; from saved values only, not the open dialog.
  function throughOutput(node) {
    if (node.publishesThroughOutput === true) return true;
    return (node.homeAssistant === null || node.homeAssistant === undefined) && (node.publishState === true || node.publishState === "true");
  }
  // Its area is needed while it publishes, and for a node saved before the
  // choice whenever either old setting was on, as the runtime checks.
  function needsArea(node) {
    function on(value) { return value === true || value === "true"; }
    var saved = !$("#node-input-homeAssistant").length && (node.homeAssistant === null || node.homeAssistant === undefined);
    return publishChoice(node) !== "off" || (saved && (on(node.publishState) || on(node.discovery)));
  }
  RED.nodes.registerType("home-avr-controller", {
    category: "home theatre",
    paletteLabel: "receiver",
    color: "#c7d9f1",
    defaults: {
      // A marker only a node new from the palette has, as core nodes do: import
      // and paste keep the saved name, so onadd leaves a saved node's settings.
      name: {value: "_DEFAULT_"},
      // Required only when the node publishes, and then with a letter or
      // digit, from which its topics and IDs are made.
      area: {value: "", validate: function (v) { return !needsArea(this) || /[a-z0-9]/i.test(String(v || "")); }},
      sources: {value: "{\"shield\":\"SAT/CBL\",\"playstation\":\"GAME\"}", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      retryMs: {value: 2000, required: true, validate: RED.validators.number()},
      maxAttempts: {value: 3, required: true, validate: RED.validators.number()},
      // In dB (the receiver's 80 is 0 dB).
      minVolumeDb: {value: -80, validate: volumeBound},
      maxVolumeDb: {value: -20, validate: volumeBound},
      // The 0-98 bounds of a node saved before 5.0, removed in 6.0 but kept
      // here, with no form row, so the editor carries them: the editor keeps
      // only the properties named here, and without them a deploy from the
      // editor would leave the node with no bounds at all, which the runtime
      // would give the default bounds, possibly louder than the old cap.
      // With them, the node stays an invalid configuration until its dB
      // bounds are set.
      minVolume: {value: ""},
      maxVolume: {value: ""},
      // The receiver published nothing before these settings, so both start off.
      // Publish: off, state or discovery. null means "not set": a node saved
      // before this setting, read from the two below, kept with no rows.
      homeAssistant: {value: null},
      // Node-RED's MQTT broker node, through which it publishes and reads its set
      // topics itself. Needed unless Publish is "Don't publish". The editor offers
      // the first broker when the dialog is opened and saved, not when the node
      // is dropped.
      broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
        return publishChoice(this) === "off" || (Boolean(v) && v !== "_ADD_") || throughOutput(this) ? true : "choose a broker, or set Publish to Don't publish";
      }},
      publishState: {value: false},
      discovery: {value: false},
      // true for a node that publishes through its output, as before 6.2, and
      // was opened and saved without a broker: it stays valid until a broker is
      // chosen. No form row.
      publishesThroughOutput: {value: false},
      discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
      // How Home Assistant IDs are named; the receiver has no older entities,
      // so not set also means "node".
      idScheme: {value: null}
    },
    onadd: function () {
      if (this.name !== "_DEFAULT_") return;
      this.name = "";
      this.idScheme = "node";
    },
    oneditprepare: function () {
      $("#node-input-homeAssistant").val(publishChoice(this));
      // The broker only while it publishes, the prefix only with discovery.
      var outputBefore = throughOutput(this);
      function publishRows() {
        var broker = $("#node-input-broker").val();
        $(".publish-through-output").toggle($("#node-input-homeAssistant").val() !== "off" && outputBefore && (!broker || broker === "_ADD_"));
        var choice = $("#node-input-homeAssistant").val();
        $(".publish-broker").toggle(choice !== "off");
        $(".publish-discovery").toggle(choice === "discovery");
        $("#node-input-area, #node-input-broker").trigger("change");
      }
      $("#node-input-homeAssistant, #node-input-broker").on("change", publishRows);
      publishRows();
    },
    // Once the dB bounds are set, the removed 0-98 ones go.
    oneditsave: function () {
        // Through its output until a broker is chosen (read before the
        // dialog's values are applied).
        var broker = $("#node-input-broker").val();
        this.publishesThroughOutput = throughOutput(this) && (!broker || broker === "_ADD_");
      if (given($("#node-input-minVolumeDb").val())) this.minVolume = "";
      if (given($("#node-input-maxVolumeDb").val())) this.maxVolume = "";
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ["Denon commands", "state and results", "MQTT publications"],
    icon: "font-awesome/fa-volume-up",
    label: function () { return this.name || (this.area ? this.area + " " : "") + "AVR controller"; }
  });
  })();
</script>

<script type="text/html" data-template-name="home-avr-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-sources">Sources</label><input type="text" id="node-input-sources"></div>
  <div class="form-row"><label for="node-input-retryMs">Retry milliseconds</label><input type="number" id="node-input-retryMs"></div>
  <div class="form-row"><label for="node-input-maxAttempts">Maximum attempts</label><input type="number" id="node-input-maxAttempts"></div>
  <div class="form-row"><label for="node-input-minVolumeDb">Minimum volume (dB)</label><input type="number" step="0.5" id="node-input-minVolumeDb"></div>
  <div class="form-row"><label for="node-input-maxVolumeDb">Maximum volume (dB)</label><input type="number" step="0.5" id="node-input-maxVolumeDb"></div>
  <div class="form-row">
    <label for="node-input-homeAssistant">Publish</label>
    <select id="node-input-homeAssistant">
      <option value="off">Don't publish</option>
      <option value="state">MQTT state</option>
      <option value="discovery">MQTT state and Home Assistant discovery</option>
    </select>
  </div>
  <div class="form-row publish-broker"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips publish-broker">With a broker, it publishes and reads its set topics itself: an MQTT out on its
    publication output, an MQTT in on its set topics, and a Status node are no longer needed and can be deleted.</div>
  <div class="form-tips publish-through-output">This node publishes through its output, as before 6.2, and keeps
    working that way. Choose a Broker to let it publish itself.</div>
  <div class="form-row publish-discovery"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
</script>

<script type="text/html" data-help-name="home-avr-controller">
  <p>Owns explicit power, main-zone, source and bounded volume commands for a Denon AVR.</p>
  <p>Send protocol observations as <code>msg.avr = {kind: "observed", line: msg.payload}</code>.</p>
  <p>Send activity requests as <code>msg.avr = {kind: "intent", requestId, generation, power: "on", source: "shield"}</code>. Omit <code>source</code> to preserve the current input, or use <code>power: "standby"</code> to stop the AVR.</p>
  <p>Send volume requests as <code>msg.avr = {kind: "volume", requestId, mode: "absolute", valueDb: -50}</code> or use <code>mode: "relative"</code> with a positive or negative change. Volume is in dB, as are the bounds, results and published state; the receiver's 80 is 0 dB. A <code>value</code> in the receiver's own 0-98 was removed in 6.0: such a request is answered <code>volume_rejected</code> with reason <code>removed-volume-value</code>, with a warning in the log. A node saved before 5.0 with only its 0-98 bounds is an invalid configuration until <b>Minimum volume (dB)</b> and <b>Maximum volume (dB)</b> are set. The controller applies configured bounds, accumulates rapid relative requests, confirms fresh <code>MV</code> evidence and releases ownership so external adjustments are preserved.</p>
  <p>Send <code>kind: "startup"</code> after deployment to discard stale observations and query the receiver; a volume request still pending then is reported as failed with reason <code>restart</code>. Send <code>kind: "refresh"</code> to re-read the receiver without disturbing work in flight. Output 1 connects to a TCP output node; output 2 emits state plus ready, failed, rejected, superseded and volume results.</p>
  <p>While it has a request, output 2 also carries <code>msg.theatre = {kind: "target_state", target: "avr", requestId, generation, status, observedAt, details}</code>, so it can be wired straight back to a theatre activity controller. A ready state is stamped with the oldest receiver reading the request relies on, and a <code>refresh</code> is answered once the receiver reports again.</p>
  <h3>Volume results</h3>
  <dl class="message-properties">
    <dt>volume_ready</dt><dd><code>{kind, area, requestId, volume, bounded}</code>: confirmed by a fresh reading.</dd>
    <dt>volume_rejected</dt><dd><code>{kind, area, requestId, reason}</code>: not sent, for example <code>receiver-not-ready</code> or an invalid request.</dd>
    <dt>volume_failed</dt><dd><code>{kind, area, requestId, reason, operation, attempts}</code>: <code>reason</code> is <code>attempts-exhausted</code> (with the operation and attempts) or <code>restart</code> (operation and attempts are <code>null</code>).</dd>
    <dt>volume_manual_override</dt><dd><code>{kind, area, requestId, reason, observed, target}</code>: the receiver moved elsewhere while the request was in flight.</dd>
    <dt>volume_external</dt><dd><code>{kind, area, previous, observed}</code>: a change made outside any request.</dd>
  </dl>
  <h3>Publishing</h3>
  <p>Off unless switched on, and then named after the <b>Area</b>, which is needed.</p>
  <dl class="message-properties">
    <dt>Publish: MQTT state</dt><dd>what the receiver reports, retained, whenever it changes:
      <code>home/&lt;area&gt;/receiver/power/state</code> (<code>ON</code> or <code>OFF</code>),
      <code>…/source/state</code> (the source name) and <code>…/volume/state</code>, with <code>online</code> or
      <code>offline</code> on <code>…/availability</code>.</dd>
    <dt>Publish: MQTT state and Home Assistant discovery</dt><dd>power and source sensors, and a volume number in dB between <b>Minimum volume</b>
      and <b>Maximum volume</b>. It includes the MQTT state, which they read. A volume set there arrives on
      <code>…/volume/set</code>; wire an MQTT in node on that topic into this node. Sets arriving within 0.3 seconds
      of each other (a slider, repeated taps) are settled to the last one, which becomes an ordinary absolute
      volume request, bounded and confirmed like any other: it waits for a power or source change in progress (such
      as a theatre activity's), and is rejected with <code>receiver-not-ready</code> while the receiver is off.</dd>
  </dl>
  <p>These go on the third output; wire it to an MQTT out node. The node announces itself once the flows have
    started, and again at <code>kind: "startup"</code>.</p>
  <h3>Broker</h3>
  <p>Choose Node-RED's <b>MQTT broker</b> node, and it publishes and reads its set topic itself: it announces everything each time the
    broker connects, reconnects included, and each time Home Assistant comes back (<code>online</code> on
    <code>&lt;prefix&gt;/status</code>), so its entities come back by themselves.
    Each connect also runs its startup message, as a Status node's "connected" did without a broker. Its publication output then sends
    nothing, and an MQTT out on it, an MQTT in on its set topic and a Status node are no longer needed: still wired, they change nothing.
    Opening and saving the node offers the first broker in your flows. A node saved before 6.2 that publishes keeps
    publishing on its output, as below, and needs no broker until you choose one.</p>
  <h3>When MQTT out connects</h3>
  <p>Without a broker, wire a <b>Status node</b> whose scope is your MQTT out node into this node. Each time MQTT out shows
    "connected", this node takes it as its startup message (<code>msg.avr = {kind: "startup"}</code>) and announces itself again:
    Node-RED's MQTT broker node drops what it is given before it connects, so what the node sends as the flows
    start is lost on a first start, a full deploy or a restart. Any other status message is ignored.</p>
</script>
