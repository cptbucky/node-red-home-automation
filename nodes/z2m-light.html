<script type="text/javascript">
  RED.nodes.registerType("home-z2m-light", {
    category: "home devices",
    color: "#e2d96e",
    defaults: {
      // A marker only a node new from the palette has, as core nodes do: import
      // and paste keep the saved name, so onadd leaves a saved node's settings.
      name: {value: "_DEFAULT_"},
      // Node-RED's MQTT broker node, through which it subscribes to its device's
      // topics and publishes on them itself. The editor offers the first broker
      // when the dialog is opened and saved, not when the node is dropped.
      broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
        return (Boolean(v) && v !== "_ADD_") || this.publishesThroughOutput !== false ? true : "choose a broker";
      }},
      // Whether it reaches its device through MQTT in and out nodes, as before
      // 6.2, and so needs no broker until one is chosen. A node saved before
      // this setting loads without it (the editor applies no defaults to the
      // deployed flows), which counts as true; a new node sets false (onadd).
      // No row.
      publishesThroughOutput: {value: false},
      // The room's id for this light: no default, it names the user's own.
      target: {value: "", required: true, validate: function (v) { return String(v || "").trim() !== ""; }},
      baseTopic: {value: "zigbee2mqtt", required: true, validate: function (v) {
        var base = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return base !== "" && !/[+#]/.test(base);
      }},
      // No default: it names the user's own light or group.
      friendlyName: {value: "", required: true, validate: function (v) {
        var name = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return name !== "" && !/[+#]/.test(name);
      }},
      group: {value: false}
    },
    onadd: function () {
      if (this.name !== "_DEFAULT_") return;
      this.name = "";
      this.publishesThroughOutput = false;
    },
    oneditprepare: function () {
      var node = this;
      // While it reaches its device through MQTT in and out nodes, that it does
      // until given a broker.
      function rows() {
        var broker = $("#node-input-broker").val();
        $(".device-through-output").toggle(node.publishesThroughOutput !== false && (!broker || broker === "_ADD_"));
      }
      $("#node-input-broker").on("change", rows);
      rows();
    },
    oneditsave: function () {
      // A broker chosen: it publishes itself from now on.
      var broker = $("#node-input-broker").val();
      if (broker && broker !== "_ADD_") this.publishesThroughOutput = false;
      else if (this.publishesThroughOutput !== false) this.publishesThroughOutput = true;
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["to the light (MQTT out, without a broker)", "to the room lighting controller"],
    icon: "font-awesome/fa-lightbulb-o",
    label: function () { return this.name || this.friendlyName || "zigbee2mqtt light"; },
    paletteLabel: "zigbee2mqtt light"
  });
</script>

<script type="text/html" data-template-name="home-z2m-light">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips">With a broker, it subscribes to its device's topics and publishes on them itself: the MQTT in and
    MQTT out nodes around it are no longer needed and can be deleted.</div>
  <div class="form-tips device-through-output">This node reaches its device through MQTT in and out nodes, as before 6.2,
    and keeps working that way. Choose a Broker to let it do so itself.</div>
  <div class="form-row"><label for="node-input-target">Target</label><input type="text" id="node-input-target" placeholder="the room's id for this light"></div>
  <div class="form-row"><label for="node-input-baseTopic">Base topic</label><input type="text" id="node-input-baseTopic"></div>
  <div class="form-row"><label for="node-input-friendlyName">Friendly name</label><input type="text" id="node-input-friendlyName" placeholder="the light's or group's name in Zigbee2MQTT"></div>
  <div class="form-row"><label for="node-input-group">Zigbee2MQTT group</label><input type="checkbox" id="node-input-group" style="display:inline-block; width:auto;"></div>
</script>

<script type="text/html" data-help-name="home-z2m-light">
  <p>Connects one Zigbee2MQTT light, or a Zigbee2MQTT group of lights, to a <b>room lighting controller</b>, over
    Zigbee2MQTT's MQTT messages: no function nodes, and never Home Assistant. Use one per light in the room's targets.</p>
  <p>The devices: <a href="https://www.zigbee2mqtt.io/supported-devices/" target="_blank">Zigbee2MQTT's supported devices</a>.</p>
  <h3>Wiring</h3>
  <p>With a <b>Broker</b>, it subscribes to <code>&lt;base&gt;/&lt;friendly name&gt;</code>, its <code>/set</code> and its <code>/availability</code> (exactly these: a friendly name can contain <code>/</code>) and publishes on its device's topics itself: leave out the MQTT
    in and MQTT out nodes below (still wired, they change nothing). Its first output then sends nothing. It reads its light on each connect (not a group, which Zigbee2MQTT can't be asked), as a Status node's startup did through the room. A node saved
    before 6.2 keeps using them until you choose a broker.</p>
  <ol>
    <li>An <b>MQTT in</b> node subscribed to <code>&lt;base&gt;/&lt;friendly name&gt;/#</code> (output: auto-detect)
      → this node. That covers the light's state, its <code>/set</code> topic (to see other people's commands) and its
      availability.</li>
    <li>The room controller's second output (its light commands) → this node. One wire can feed every light's node:
      each acts only on its own <b>Target</b>.</li>
    <li>This node's first output → an <b>MQTT out</b> node on the same broker, with no topic set.</li>
    <li>This node's second output (readings) → the room controller.</li>
  </ol>
  <h3>What it does</h3>
  <p>It turns the room's commands into Zigbee2MQTT's <code>/set</code> payloads (brightness 1-254, colour temperature
    in mireds, the transition), exactly as the room sent them before 6.0, and the light's reports into readings in
    percent and kelvin. It tells its own commands from someone else's: an exact echo on <code>/set</code> is its own;
    a bare ON or OFF arriving while one of its own with that power hasn't come back is its own, changed on the way;
    anything else is someone else's, which the room may take as a person's change. When the room restyles a light that
    already shows that style, it sends nothing and tells the room so. When the room starts, it asks the light to report
    (<code>/get</code>).</p>
  <p>Availability (<code>/availability</code>) is passed on and shown by the room, but changes nothing.</p>
  <h3>Groups</h3>
  <p>Tick <b>Zigbee2MQTT group</b> for a group. Commands are the same. Zigbee2MQTT works out a group's state itself,
    from what it sent and its members' reports, so a group's report follows a command at once. A group has no
    availability and can't be asked to report, so at the room's startup the node sends nothing: the room waits for
    Zigbee2MQTT's next state for the group. (Passing on an old state could settle a command still on its way.)</p>
  <p>Switch on the group's <b>retain</b> in Zigbee2MQTT: <code>retain: true</code> under the group in Zigbee2MQTT's
    <code>configuration.yaml</code> (it is off by default). Zigbee2MQTT doesn't retain a group's state by default, so after a restart the
    room has no reading for the group until it changes, and an activity that holds it waits on it. With retain, the broker
    gives this node the group's last state as soon as it (or its MQTT in node) subscribes. A group that has had no state 30 seconds
    after it started shows <i>group · no state yet: set retain: true for it in Zigbee2MQTT</i> on its status.</p>
  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Target</dt><dd>The light's id in the room controller's Targets JSON.</dd>
    <dt>Base topic</dt><dd>Zigbee2MQTT's base topic, <code>zigbee2mqtt</code> unless you changed it.</dd>
    <dt>Friendly name</dt><dd>The light's or group's name in Zigbee2MQTT.</dd>
  </dl>
  <p>For a light that isn't Zigbee2MQTT's, see the neutral light contract in the README: any flow that answers the
    room's <code>msg.light</code> commands with <code>msg.light</code> readings works in this node's place.</p>
</script>
