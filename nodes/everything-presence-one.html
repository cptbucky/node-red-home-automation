<script type="text/javascript">
  RED.nodes.registerType("home-everything-presence-one", {
    category: "home automation",
    color: "#e2d96e",
    defaults: {
      name: {value: ""},
      // Node-RED's MQTT broker node, through which it subscribes to the
      // device's topics. The editor offers the first broker when the dialog is
      // opened and saved.
      broker: {value: "", type: "mqtt-broker", required: true},
      // No default: it names the user's own device.
      device: {value: "", required: true, validate: function (v) {
        var device = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return device !== "" && !/[+#]/.test(device);
      }},
      // Where the device's discovery is: ESPHome's default. A node saved
      // before this setting loads without it (the editor applies no defaults
      // to deployed flows); missing or empty means homeassistant, as the
      // runtime reads it.
      discoveryPrefix: {value: "homeassistant", validate: function (v) {
        return !/[+#]/.test(String(v === undefined || v === null ? "" : v));
      }}
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["motion and presence, to occupancy fusion", "light level, to the motion lighting policy"],
    icon: "font-awesome/fa-eye",
    label: function () { return this.name || this.device || "everything presence one"; },
    paletteLabel: "everything presence one"
  });
</script>

<script type="text/html" data-template-name="home-everything-presence-one">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-row"><label for="node-input-device">Device</label><input type="text" id="node-input-device" placeholder="its ESPHome name"></div>
  <div class="form-row"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
  <div class="form-tips">It subscribes to the device's entities and status itself: no MQTT in, change or function nodes.</div>
</script>

<script type="text/html" data-help-name="home-everything-presence-one">
  <p>Connects an <b>Everything Presence One</b> (Everything Smart Technology's ESPHome presence sensor) to a room: its PIR,
    its mmWave radar and its light sensor become the messages <b>home occupancy fusion</b> and the <b>home motion lighting
    policy</b> take, over ESPHome's own MQTT messages: no function or change nodes, and never Home Assistant.</p>
  <h3>Wiring</h3>
  <ol>
    <li>Output 1 (motion and presence) → occupancy fusion, with its presence sensor set to hold.</li>
    <li>Output 2 (light level) → the motion lighting policy.</li>
  </ol>
  <p>Choose the <b>Broker</b> the device uses (MQTT on in its ESPHome configuration), and set <b>Device</b> to its ESPHome
    name, the prefix of its MQTT topics (such as <code>everything-presence-one-1a2b3c</code>).</p>
  <h3>What it reads</h3>
  <ul>
    <li><b>Motion</b>: <code>binary_sensor/pir</code>, the PIR: quick to see someone arrive.</li>
    <li><b>Presence</b>: <code>binary_sensor/mmwave</code>, the radar: sees someone sitting still, so occupancy fusion
      holds the room while they stay.</li>
    <li><b>Light level</b>: <code>sensor/illuminance</code>, in lux.</li>
    <li>Not its own <code>occupancy</code> entity: that combines the two on the device, and occupancy fusion does that
      combining here.</li>
  </ul>
  <h3>How it finds its entities</h3>
  <p>From the device's own MQTT discovery first: each entity it describes, by device class (motion; occupancy or
    presence; illuminance), with its state topic, so a firmware that renames an entity still works. The device's model
    in its discovery must be this one. Without discovery (turn it on with <code>mqtt: discovery: true</code> in the
    device's ESPHome configuration and flash it again), or with another model's, it uses the entity names below. Its
    status ends with <i>discovered</i> or <i>preset</i>.</p>
  <h3>Readings</h3>
  <ul>
    <li>Output 1: <code>{source: "motion" | "presence", payload: true | false}</code>, from ON and OFF only.</li>
    <li>Output 2: <code>{source: "illuminance", payload: &lt;lux&gt;}</code>, from a number only.</li>
    <li>Anything else (such as <code>nan</code>) is ignored with a trace, and only a change is sent.</li>
    <li>As Node-RED starts, ESPHome's retained states are the device's current ones while its status is online. They
      are sent with <code>msg.baseline = true</code>: an occupied room switches nothing on, and an empty one starts its
      vacancy, so its lights go off when the motion policy's delay runs out. A retained state from a device that isn't
      online is ignored.</li>
  </ul>
</script>
