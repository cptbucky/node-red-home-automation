<script type="text/javascript">
  RED.nodes.registerType("home-shelly-cover", {
    category: "home devices",
    color: "#e2d96e",
    defaults: {
      // A marker only a node new from the palette has, as core nodes do: import
      // and paste keep the saved name, so onadd leaves a saved node's settings.
      name: {value: "_DEFAULT_"},
      // Node-RED's MQTT broker node, through which it subscribes to its device's
      // topics and publishes on them itself. The editor offers the first broker
      // when the dialog is opened and saved, not when the node is dropped.
      broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
        return (Boolean(v) && v !== "_ADD_") || this.publishesThroughOutput !== false ? true : "choose a broker";
      }},
      // Whether it reaches its device through MQTT in and out nodes, as before
      // 6.2, and so needs no broker until one is chosen. A node saved before
      // this setting loads without it (the editor applies no defaults to the
      // deployed flows), which counts as true; a new node sets false (onadd).
      // No row.
      publishesThroughOutput: {value: false},
      // No default: it names the user's own device.
      topicPrefix: {value: "", required: true, validate: function (v) {
        var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, "");
        return prefix !== "" && !/[+#]/.test(prefix);
      }},
      channel: {value: 0, required: true, validate: function (v) {
        return /^\d+$/.test(String(v).trim());
      }}
    },
    onadd: function () {
      if (this.name !== "_DEFAULT_") return;
      this.name = "";
      this.publishesThroughOutput = false;
    },
    oneditprepare: function () {
      var node = this;
      // While it reaches its device through MQTT in and out nodes, that it does
      // until given a broker.
      function rows() {
        var broker = $("#node-input-broker").val();
        $(".device-through-output").toggle(node.publishesThroughOutput !== false && (!broker || broker === "_ADD_"));
      }
      $("#node-input-broker").on("change", rows);
      rows();
    },
    oneditsave: function () {
      // A broker chosen: it publishes itself from now on.
      var broker = $("#node-input-broker").val();
      if (broker && broker !== "_ADD_") this.publishesThroughOutput = false;
      else if (this.publishesThroughOutput !== false) this.publishesThroughOutput = true;
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["to the device (MQTT out, without a broker)", "to the cover controller"],
    icon: "font-awesome/fa-exchange",
    label: function () { return this.name || "shelly cover"; },
    paletteLabel: "shelly cover"
  });
</script>

<script type="text/html" data-template-name="home-shelly-cover">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips">With a broker, it subscribes to its device's topics and publishes on them itself: the MQTT in and
    MQTT out nodes around it are no longer needed and can be deleted.</div>
  <div class="form-tips device-through-output">This node reaches its device through MQTT in and out nodes, as before 6.2,
    and keeps working that way. Choose a Broker to let it do so itself.</div>
  <div class="form-row"><label for="node-input-topicPrefix">MQTT topic prefix</label><input type="text" id="node-input-topicPrefix" placeholder="the device's ID, e.g. shellyplus2pm-a8032ab12345"></div>
  <div class="form-row"><label for="node-input-channel">Cover ID</label><input type="number" min="0" step="1" id="node-input-channel"></div>
</script>

<script type="text/html" data-help-name="home-shelly-cover">
  <p>Connects a Shelly Gen2 or later device in cover mode to a <b>home cover controller</b>, over the device's own
    MQTT API: no function nodes, no Home Assistant and no HTTP.</p>
  <p>The devices: <a href="https://shelly-api-docs.shelly.cloud/gen2/" target="_blank">Shelly's Gen2+ device documentation</a>.</p>
  <h3>Wiring</h3>
  <p>With a <b>Broker</b>, it subscribes to <code>&lt;prefix&gt;/#</code> and publishes on its device's topics itself: leave out the MQTT
    in and MQTT out nodes below (still wired, they change nothing). Its first output then sends nothing. It reads its cover on each connect, as a Status node's startup did through the cover controller. A node saved
    before 6.2 keeps using them until you choose a broker.</p>
  <ol>
    <li>An <b>MQTT in</b> node subscribed to <code>&lt;prefix&gt;/#</code> (output: auto-detect) → this node.</li>
    <li>The cover controller's first output (its device commands) → this node.</li>
    <li>This node's first output → an <b>MQTT out</b> node on the same broker, with no topic set.</li>
    <li>This node's second output → the cover controller.</li>
  </ol>
  <p>On the device, MQTT must be on with <b>Enable MQTT Control</b> (the default): without it the device ignores
    the commands this node sends. <b>RPC status notifications</b> (also the default) report each change; with
    <b>Generic status update</b> it also reports a full status on every significant change. Calibrate the cover
    on the device first.</p>
  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>MQTT topic prefix</dt><dd>the device's topic prefix: its device ID (such as
      <code>shellyplus2pm-a8032ab12345</code>) unless a custom one is set on the device.</dd>
    <dt>Cover ID</dt><dd><code>0</code>, or <code>1</code> for a device's second cover.</dd>
  </dl>
  <h3>What it does</h3>
  <ul>
    <li><code>set_position</code> is sent as <code>pos,&lt;0-100&gt;</code>, <code>stop</code> as <code>stop</code>,
      and <code>observe</code> as <code>status_update</code>, which makes the device report a fresh status, on
      <code>&lt;prefix&gt;/command/cover:&lt;id&gt;</code>.</li>
    <li>The device's status, from <code>&lt;prefix&gt;/status/cover:&lt;id&gt;</code> and its change notifications on
      <code>&lt;prefix&gt;/events/rpc</code>, becomes <code>msg.cover = {kind: "observed", position, motion,
      observedAt}</code>, with 0 closed and 100 open (set <b>invert</b> on the controller if yours runs the other
      way). <code>&lt;prefix&gt;/online</code> becomes <code>{kind: "availability", online}</code>.</li>
    <li>A cover that isn't calibrated, or doesn't know its position, has no position to report: the controller's
      command in hand fails with reason <code>not-calibrated</code> or <code>position-unknown</code>, and a
      position isn't sent to an uncalibrated cover, which would refuse it.</li>
    <li>Anything else on the input is ignored. The node's status shows the cover's last state and position.</li>
  </ul>
</script>
