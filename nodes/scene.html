<script type="text/javascript">
  (function () {
    // The lights as lib/scene.ts reads them: its room's area and its id there,
    // ON or OFF, and for an ON light optional brightnessPct (0-100) and
    // colorTempKelvin (above 0); each light once.
    function validLights(v) {
      try {
        var lights = JSON.parse(v);
        if (!Array.isArray(lights)) return false;
        var seen = {};
        return lights.every(function (light) {
          if (!light || typeof light !== "object" || Array.isArray(light)) return false;
          var target = typeof light.target === "string" ? light.target.trim() : "";
          var area = topicName(light.area);
          var state = String(light.state || "").toUpperCase();
          if (!target || !area || seen[area + "/" + target] || (state !== "ON" && state !== "OFF")) return false;
          seen[area + "/" + target] = true;
          return Object.keys(light).every(function (key) {
            var value = light[key];
            if (key === "area" || key === "target" || key === "state") return true;
            if (state === "OFF" || typeof value !== "number" || !isFinite(value)) return false;
            if (key === "brightnessPct") return value >= 0 && value <= 100;
            if (key === "colorTempKelvin") return value > 0;
            return false;
          });
        });
      } catch (e) { return false; }
    }
    // A name or area as topics and Home Assistant IDs read it (lib/topic-names.ts areaId).
    function topicName(v) { return String(v || "").trim().toLowerCase().replace(/[^a-z0-9_-]+/g, "_").replace(/^[_-]+|[_-]+$/g, ""); }
    // Its Publish choice (off, state or discovery), from the open dialog or
    // its saved settings: a node saved before the choice reads its two old
    // settings (lib/home-assistant-setting.ts).
    function publishChoice(node) {
      function on(value) { return value === true || value === "true"; }
      var select = $("#node-input-homeAssistant");
      if (select.length) return select.val();
      if (node.homeAssistant === "off" || node.homeAssistant === "state" || node.homeAssistant === "discovery") return node.homeAssistant;
      return !on(node.publishState) ? "off" : on(node.discovery) ? "discovery" : "state";
    }
    // Whether it publishes through its output, as before 6.2: a node saved
    // before the Publish choice that published, or one opened and saved since
    // without a broker (publishesThroughOutput). It needs no broker until one
    // is chosen; from saved values only, not the open dialog.
    function throughOutput(node) {
      if (node.publishesThroughOutput === true) return true;
      return (node.homeAssistant === null || node.homeAssistant === undefined) && (node.publishState === true || node.publishState === "true");
    }
    // Its area is needed while it publishes, and for a node saved before the
    // choice whenever either old setting was on, as the runtime checks.
    function needsArea(node) {
      function on(value) { return value === true || value === "true"; }
      var saved = !$("#node-input-homeAssistant").length && (node.homeAssistant === null || node.homeAssistant === undefined);
      return publishChoice(node) !== "off" || (saved && (on(node.publishState) || on(node.discovery)));
    }
    RED.nodes.registerType("home-scene", {
      category: "home automation",
      color: "#e2d96e",
      defaults: {
        // No default: it names the scene to its rooms, motion policies and
        // Home Assistant, so two scenes can't share one: they would share an
        // owner, and one's end would release the other's lights and pause.
        name: {value: "", required: true, validate: function (v) {
          var own = topicName(v);
          if (!own) return false;
          var self = this;
          var clash = false;
          RED.nodes.eachNode(function (other) {
            if (other.type === "home-scene" && other.id !== self.id && topicName(other.name) === own) clash = true;
          });
          return clash ? "another scene has this name" : true;
        }},
        lights: {value: "[]", required: true, validate: validLights},
        safetyHours: {value: 4, required: true, validate: function (v) { var n = Number(v); return String(v).trim() !== "" && isFinite(n) && n >= 0; }},
        // Optional: a power meter's reading (msg.power) below this many watts,
        // for endBelowSeconds, ends the scene. Empty: none. A scene saved
        // before these settings loads without them, which is valid.
        endBelowWatts: {value: "", validate: function (v) {
          if (v === undefined || v === null || String(v).trim() === "") return true;
          var n = Number(v); return isFinite(n) && n > 0;
        }},
        endBelowSeconds: {value: 60, validate: function (v) {
          if (v === undefined || v === null || String(v).trim() === "") return true;
          var n = Number(v); return isFinite(n) && n >= 0;
        }},
        area: {value: "", validate: function (v) { return !needsArea(this) || /[a-z0-9]/i.test(String(v || "")); }},
        // Off until switched on.
        // Publish: off, state or discovery. null means "not set": a node saved
        // before this setting, read from the two below, kept with no rows.
        homeAssistant: {value: null},
        // Node-RED's MQTT broker node, through which it publishes and reads its set
        // topics itself. Needed unless Publish is "Don't publish". The editor offers
        // the first broker when the dialog is opened and saved, not when the node
        // is dropped.
        broker: {value: "", type: "mqtt-broker", required: false, validate: function (v) {
          return publishChoice(this) === "off" || (Boolean(v) && v !== "_ADD_") || throughOutput(this) ? true : "choose a broker, or set Publish to Don't publish";
        }},
        publishState: {value: false},
        discovery: {value: false},
        // true for a node that publishes through its output, as before 6.2, and
        // was opened and saved without a broker: it stays valid until a broker is
        // chosen. No form row.
        publishesThroughOutput: {value: false},
        discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
        idScheme: {value: "node"}
      },
      oneditsave: function () {
        // Through its output until a broker is chosen (read before the
        // dialog's values are applied).
        var broker = $("#node-input-broker").val();
        this.publishesThroughOutput = throughOutput(this) && (!broker || broker === "_ADD_");
      },
      oneditprepare: function () {
        function on(value) { return value === true || value === "true"; }
        $("#node-input-homeAssistant").val(publishChoice(this));
        // The broker only while it publishes, the prefix only with discovery.
        var outputBefore = throughOutput(this);
        function publishRows() {
          var broker = $("#node-input-broker").val();
          $(".publish-through-output").toggle($("#node-input-homeAssistant").val() !== "off" && outputBefore && (!broker || broker === "_ADD_"));
          var choice = $("#node-input-homeAssistant").val();
          $(".publish-broker").toggle(choice !== "off");
          $(".publish-discovery").toggle(choice === "discovery");
          $("#node-input-area, #node-input-broker").trigger("change");
        }
        $("#node-input-homeAssistant, #node-input-broker").on("change", publishRows);
        publishRows();
      },
      inputs: 1,
      outputs: 3,
      outputLabels: ["to room lighting controllers", "to motion lighting policies", "MQTT publications"],
      icon: "font-awesome/fa-magic",
      label: function () { return this.name || "scene"; },
      paletteLabel: "scene"
    });
  })();
</script>

<script type="text/html" data-template-name="home-scene">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name" placeholder="Bath, for example"></div>
  <div class="form-row"><label for="node-input-lights">Lights</label><input type="text" id="node-input-lights" placeholder='[{"area":"gym","target":"main","state":"OFF"}]'></div>
  <div class="form-row"><label for="node-input-safetyHours">Safety timer (hours)</label><input type="number" id="node-input-safetyHours" min="0" step="0.25"> <span>(0: off)</span></div>
  <div class="form-row"><label for="node-input-endBelowWatts">End below (W)</label><input type="number" id="node-input-endBelowWatts" min="0" step="1" placeholder="none"> <span>for</span>
    <input type="number" id="node-input-endBelowSeconds" min="0" step="1" style="width:70px"> <span>s</span></div>
  <div class="form-tips">Wire a power meter node (such as a zigbee2mqtt power node on a device's plug) to the scene: power
    below this, held that long, ends the scene "by power".</div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row">
    <label for="node-input-homeAssistant">Publish</label>
    <select id="node-input-homeAssistant">
      <option value="off">Don't publish</option>
      <option value="state">MQTT state</option>
      <option value="discovery">MQTT state and Home Assistant discovery</option>
    </select>
  </div>
  <div class="form-row publish-broker"><label for="node-input-broker">Broker</label><input type="text" id="node-input-broker"></div>
  <div class="form-tips publish-broker">With a broker, it publishes and reads its set topics itself: an MQTT out on its
    publication output, an MQTT in on its set topics, and a Status node are no longer needed and can be deleted.</div>
  <div class="form-tips publish-through-output">This node publishes through its output, as before 6.2, and keeps
    working that way. Choose a Broker to let it publish itself.</div>
  <div class="form-row publish-discovery"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
</script>

<script type="text/html" data-help-name="home-scene">
  <p>One scene, such as <i>Bath</i> or <i>Exercise mode</i>. While it is on, it holds some of a room's lights on or
    off with the values it gives them, and pauses motion lighting. When it ends, it lets them go, and each room gives
    its lights back what they were before the scene (or to a scene that is still on beneath it). It reaches lights
    only through room lighting controllers, and never through Home Assistant.</p>
  <h3>Wiring</h3>
  <ol>
    <li>Output 1 → each <b>room lighting controller</b> whose lights it sets.</li>
    <li>Output 2 → each <b>motion lighting policy</b> it should pause while on.</li>
    <li>Output 3 → an <b>MQTT out</b> node, when it publishes its switch for Home Assistant, with an <b>MQTT in</b>
      node on <code>home/&lt;area&gt;/scene/&lt;name&gt;/set</code> into this node.</li>
  </ol>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>scene <span class="property-type">object</span></dt>
    <dd><code>{kind: "start"}</code> turns it on (on again: a fresh safety timer, its lights left as they are);
      <code>{kind: "end", by}</code> ends it, with <code>by</code> (optional) shown as what ended it, for any
      end trigger a flow decides. <code>{kind: "startup"}</code> announces its switch again.</dd>
    <dt>power <span class="property-type">object</span></dt>
    <dd><code>{kind: "observed", watts}</code> from a power meter node: with <b>End below</b> set, power below it,
      held for its seconds, ends the scene <i>by power</i>.</dd>
    <dt>payload <span class="property-type">string</span></dt>
    <dd><code>ON</code> or <code>OFF</code> on its set topic, from Home Assistant: a start, or an end by
      <code>home-assistant</code>.</dd>
  </dl>
  <h3>Broker</h3>
  <p>Choose Node-RED's <b>MQTT broker</b> node, and it publishes and reads its set topic itself: it announces everything each time the
    broker connects, reconnects included, and each time Home Assistant comes back (<code>online</code> on
    <code>&lt;prefix&gt;/status</code>), so its entities come back by themselves.
    Each connect also runs its startup message, as a Status node's "connected" did without a broker. Its publication output then sends
    nothing, and an MQTT out on it, an MQTT in on its set topic and a Status node are no longer needed: still wired, they change nothing.
    Opening and saving the node offers the first broker in your flows. A node saved before 6.2 that publishes keeps
    publishing on its output, as below, and needs no broker until you choose one.</p>
  <h3>When MQTT out connects</h3>
  <p>Without a broker, wire a <b>Status node</b> whose scope is your MQTT out node into this node. Each time MQTT out shows
    "connected", this node takes it as its startup message (<code>msg.scene = {kind: "startup"}</code>) and announces
    itself again: Node-RED's MQTT broker node drops what it is given before it connects, so what the node sends as
    the flows start is lost on a first start, a full deploy or a restart. Any other status message is ignored.</p>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Room lighting controllers: an owner intent per light as it starts,
      <code>{lighting: {kind: "intent", area, targets: [id], state, values?, owner: "scene:&lt;name&gt;", source: "scene"}}</code>,
      and a release per room as it ends, <code>{lighting: {kind: "release", area, owner, targets, source: "scene"}}</code>.</li>
    <li>Motion lighting policies: <code>{source: "pause", payload: true, owner}</code> as it starts and every minute
      while on, and <code>payload: false</code> as it ends. Keep each motion policy's <b>Maximum pause</b> above a
      minute (10 minutes by default), or motion runs between renewals. If the room went vacant meanwhile, motion's
      vacancy delay starts when the pause lifts.</li>
    <li>MQTT publications: its switch's state, availability and discovery.</li>
  </ol>
  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Name</dt><dd>Required, and each scene's own: it names the scene to its rooms and motion policies (owner
      <code>scene:&lt;name&gt;</code>), and in its topics and Home Assistant. The editor marks a name another scene
      has (compared as in topics, so <code>Bath</code> and <code>bath</code> are the same).</dd>
    <dt>Lights</dt><dd>A JSON array, one entry per light: <code>area</code> (its room controller's <b>Area</b>),
      <code>target</code> (the light's id in that room's Targets JSON), <code>state</code> <code>ON</code> or
      <code>OFF</code>, and for an ON light <code>brightnessPct</code> (0-100) and <code>colorTempKelvin</code>
      (optional). A socket is a room target with on/off only: give it just its state. For example
      <code>[{"area": "gym", "target": "main", "state": "OFF"}, {"area": "gym", "target": "tv", "state": "ON"}]</code>.</dd>
    <dt>Safety timer</dt><dd>Hours until it ends itself, so a forgotten scene doesn't hold the room: 4 by
      default; 0 turns it off.</dd>
    <dt>End below</dt><dd>Optional: watts, and for how many seconds (60 by default). A power reading
      (<code>msg.power</code>, from a power meter node on a device's plug) below it, held that long while the
      scene is on, ends it <i>by power</i>; one at or above it starts the wait again. Empty: no power end.</dd>
    <dt>Area, Publish</dt><dd><i>Don't publish</i> unless chosen. <i>MQTT state</i>: its state and set topic, plain
      MQTT; <i>MQTT state and Home Assistant discovery</i>: also a switch entity for the scene
      that shows whether it is on and turns it on and off, on <code>home/&lt;area&gt;/scene/&lt;name&gt;/…</code>.</dd>
  </dl>
  <h3>Rules</h3>
  <ul>
    <li>Each light names its room by the room controller's <b>Area</b>, so set the Area on each room a scene uses.
      Its intents and releases carry that area, and a room acts only on those for its own Area: two rooms may each
      have a <code>main</code>.</li>
    <li>Scenes stack: a newer scene holding a light another scene holds takes it, and hands it back to the older
      one when it ends. Ending the older one first leaves the light with the newer.</li>
    <li>A person changing a light the scene holds makes it theirs: the scene's end leaves it alone.</li>
    <li>On while the flows restart (with a context store), it stays on, with its timer; if its time ran out
      meanwhile, it ends as they start. Deleted while on, it lets its lights and motion go.</li>
  </ul>
  <h3>Status</h3>
  <p><b>on · 3h 59m left</b> (green) while on; <b>off · ended by timer</b>, <b>request</b>,
    <b>home-assistant</b> or what the end gave; <b>off</b> before it has run.</p>
</script>
