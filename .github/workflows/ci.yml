---
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.9.0  # the minimum we support (engines >=22.9, as Node-RED 5's own)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test

      - name: Node-RED 5 smoke
        shell: bash
        run: |
          smoke="${RUNNER_TEMP}/node-red-smoke"
          mkdir -p "${smoke}"
          npm pack --pack-destination "${smoke}"
          cd "${smoke}"
          npm init -y > /dev/null
          npm install --no-audit --no-fund node-red@5.0.10 ./avantics-node-red-home-automation-*.tgz
          node "${GITHUB_WORKSPACE}/scripts/node-red-smoke.mjs" "${smoke}"

      - name: Scan secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 --no-banner .

  private-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.9.0

      - name: Scan public content
        run: npm run scan:public

  build-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, private-boundary]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload roadmap
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy-pages:
    needs: build-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy roadmap
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, private-boundary]
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not 22.9: staging below needs npm stage, from npm 11, and Node.js
          # 22.9.0 brings npm 10.8.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and pack release
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          mkdir release
          npm pack --pack-destination release
          package_name="avantics-node-red-home-automation-${version}.tgz"
          package_file="release/${package_name}"
          # From inside release/, so the checksum file names the tarball alone
          # and sha256sum -c works next to a downloaded copy.
          (cd release && sha256sum "${package_name}" > "${package_name}.sha256")
          echo "file=${package_file}" >> "${GITHUB_OUTPUT}"

      - name: Stage npm release
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # A missing package or version is not an error here: it means stage.
          if published="$(npm view "${name}@${version}" version 2>/dev/null)" && [ "${published}" = "${version}" ]; then
            echo "${name}@${version} is already on npm; skipping staging."
            exit 0
          fi
          # "./" keeps npm from reading "release/<file>.tgz" as a GitHub repository.
          # The CI token cannot list staged versions, so an earlier run's staged
          # copy is only detected when the registry refuses this one.
          if ! npm stage publish "./${PACKAGE_FILE}" --access public; then
            echo "::error::Staging ${name}@${version} failed. If an earlier run already staged it, approve or reject that copy on npmjs.com (Staged Packages tab) instead of re-running."
            exit 1
          fi
          echo "::notice::Staged ${name}@${version}. It is not public until a maintainer approves it with 2FA: npmjs.com > the package > Staged Packages, or npm stage approve <stage-id>."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "${{ steps.package.outputs.file }}"
          "${{ steps.package.outputs.file }}.sha256"
          --generate-notes
          --title "${GITHUB_REF_NAME}"
